[workspace]
roots = []

[[lsp_servers]]
language_id = "typescript"
command = "bash"
args = ["-c", "exec ./node_modules/.bin/node ./node_modules/@typescript/native/bin/tsc --lsp --stdio"]
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts"]
timeout_seconds = 60
request_timeout_seconds = 60
