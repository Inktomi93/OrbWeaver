## Instruments — full visibility, never sampling

- **Read touched files IN FULL.** Never review a hunk in isolation and never skim: for every file the diff touches, read the whole file including its header (the header is per-domain law). The defect usually lives at the seam between the hunk and the code around it — an invariant the hunk silently breaks, a sibling branch it forgot. If a file is too big to read whole, `ast-grep outline` it first, then read every region the change can interact with — and say in the report which regions you did NOT read.
