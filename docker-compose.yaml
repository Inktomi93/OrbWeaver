# ── Orbweaver — docker compose ───────────────────────────────────────────────────────────────────────
#
#   git clone https://github.com/Inktomi93/orbweaver && cd orbweaver
#   docker compose up -d --build          # builds the image from this checkout (a few minutes the first time)
#   docker compose logs orbweaver         # your generated login is printed on the FIRST boot
#   → http://localhost:8788
#
# ONE service, the app only. Models are yours: paste a cloud API key in Settings, or point a connection at a
# model server you already run (Ollama / KoboldCpp / LM Studio / TabbyAPI / vLLM) at
# http://host.docker.internal:<port>. Settings live in docker/orbweaver.env (the shipped defaults, tracked)
# and docker/orbweaver.local.env (yours, gitignored). The overlays under docker/ change the SHAPE, not the
# settings — stack them with -f:
#   -f docker-compose.yaml -f docker/compose.host-network.yaml   single-user, no login, via host networking (Linux/Podman)
#   -f docker-compose.yaml -f docker/compose.secrets.yaml        secrets as mounted files, never env values
#   -f docker-compose.yaml -f docker/compose.dev.yaml            the DEVELOPMENT stack from this checkout (hot reload)
#
# Interpolated knobs (shell env, or a `.env` file beside this compose file):
#   ORB_PORT   host port                     default 8788
#   ORB_BIND   host interface                default 127.0.0.1 — read "LAN and HTTPS" in docker/README.md before 0.0.0.0
#   ORB_IMAGE  the image name/tag to build+run    default orbweaver:local (built from this checkout — no registry)
# Full guide: docker/README.md.

name: orbweaver

services:
  orbweaver:
    image: ${ORB_IMAGE:-orbweaver:local}
    build:
      context: .
      target: runtime
    container_name: orbweaver
    hostname: orbweaver
    init: true                                # tini as PID 1: signals + zombie reaping
    restart: unless-stopped
    environment:
      # The app runs as this uid/gid (default 1000). The entrypoint starts as root, makes the data dir owned
      # by it — so a bind-mounted `./data:/app/data` works without a manual chown — and drops privileges.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # The host-side publication, echoed in so the entrypoint can refuse the no-login mode on a non-loopback
      # bind (single-user + a trusted bridge range + ORB_BIND=0.0.0.0 would make the whole LAN the owner).
      ORB_BIND: ${ORB_BIND:-127.0.0.1}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      # Loopback by default: only THIS machine reaches the app, which is what makes the shipped no-login
      # mode safe. ORB_BIND=0.0.0.0 opens it to your network — only with a login (AUTH_MODE=local) and HTTPS
      # in front: the session cookie is Secure, so a plain-http LAN address cannot sign in ("LAN and HTTPS").
      - "${ORB_BIND:-127.0.0.1}:${ORB_PORT:-8788}:8788"
    extra_hosts:
      # `host.docker.internal` names THIS machine from inside the container. Docker Desktop provides it; this
      # line gives Linux the same name, so a model server on your machine is http://host.docker.internal:<port>.
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./docker/orbweaver.env            # the shipped defaults (tracked — never put a secret here)
        required: true
      - path: ./docker/orbweaver.local.env      # yours (gitignored): API keys, your password, mode changes
        required: false
    volumes:
      - orbweaver-data:/app/data                # sqlite (+ -wal/-shm) · uploaded assets · generated secrets
    read_only: true                             # immutable rootfs; the writable paths are the volume + two tmpfs
    tmpfs:
      - /tmp
      - /app/.cache                             # cwd-relative scratch (a recorder spill when WIRE_CAPTURE=on)
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]                             # the app binds a high port; nothing is needed back …
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]   # … except what the entrypoint's chown + privilege drop use, once, as root

volumes:
  orbweaver-data: {}

# ── behind a reverse proxy ───────────────────────────────────────────────────────────────────────────
# A proxy ON THIS MACHINE (Caddy / nginx / Traefik on the host) targets http://127.0.0.1:8788 as published
# above. A proxy in ITS OWN container joins this project's network instead — uncomment and point it at
# orbweaver:8788 (the compose service name is the DNS name):
#
#   networks:
#     default:
#       name: <your proxy's network>
#       external: true
#
# The proxy must pass X-Forwarded-Proto/Host/For (the OIDC callback and the IP allowlist derive from them)
# and must not buffer SSE (Caddy: `flush_interval -1` plus long timeouts). Anything public runs an SSO mode
# with AUTH_FALLBACK=deny (docker/orbweaver.env).
