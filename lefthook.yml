# Lefthook — git hooks, worktree-safe by construction.
#
# Installed via the root `prepare: lefthook install --force` script, which runs on EVERY `pnpm install`
# (main checkout AND every worktree). Lefthook 2.1.10 writes the hook stubs into the SHARED `.git/hooks`
# of the common gitdir and does NOT set `core.hooksPath` (probed 2026-09-18 from main and from a worktree,
# with and without a config change — the earlier claim here that it does was wrong). Git resolves a
# worktree's hooks from the common dir, and this file is tracked, so hooks fire in every worktree with
# zero per-worktree setup. `--force` because a stray `core.hooksPath` (pointing at that same default dir)
# appeared in .git/config twice on 2026-09-18 from an unidentified external writer, and plain
# `lefthook install` REFUSES under it — which failed every worktree's post-checkout install and every
# `isolation: "worktree"` dispatch. With --force the chain survives the key. Commands run from the worktree root (lefthook resolves it per-worktree), so a
# fresh worktree just needs `pnpm install` (or `pnpm run worktree:bootstrap`) and the gates work.
#
# GREEN-TO-COMMIT is enforced HERE, not by discipline (born-compliant doctrine — "won't pass check →
# won't commit"). The 2026-06-28 incident: test-FILE type errors (a DOM-only `BodyInit`, a bad
# WorkloadEvent literal) rode through ~10 commits because the old pre-commit ran ONLY Biome on staged
# files — and `pnpm check` (which runs `test:types`, the vitest typecheck lane that catches exactly
# those) only fired at pre-push, which never ran across a long no-push session.
#
# Split (type/structure gate at COMMIT, behavioral tests at PUSH) — both via the ONE `pnpm verify` entry
# (UNIFIED-VERIFICATION-DESIGN.md §3): the tiers ARE the hook wiring, so "run everything" is a named tier,
# not a folklore 4-command pipe. Repointed 2026-07-12 (V3).
#   • pre-commit → `pnpm check` (= `verify --static`): lint (Biome, whole repo) + per-package `tsc` +
#     `test:types` (vitest typecheck of the tests/ tree — the lane that was the blind spot) + check:structure
#     (the ts-morph gates) + dep-cruiser (every workspace package plus `tooling`). ~30s. A type/lint/boundary-red tree cannot be
#     committed. Pre-commit stays at the STATIC tier (design §4.3: full-static-at-commit is the born-compliant
#     doctrine; --changed+related-tests would be faster but weakens it).
#   • pre-push → `pnpm verify --push` (ONE command, ONE summary, ONE exit code, ONE json): the static
#     bundle + `pnpm test` (unit/integration/contract AND the Playwright CT suite — merged 2026-07-17,
#     the test script composes `pnpm test:ct --retries=2` so parallelism flakes retry instead of blocking)
#     + `pnpm e2e:smoke` (the fast `@smoke` model-free subset).
#     This REPLACES the old 4-command `piped` pipe: run-all-report-all (every stage runs, all failures shown
#     at once) instead of piped early-abort — strictly more informative, and the max-severity exit (§3.3) is
#     the single verdict. Browser suites never gate the STATIC tier (vitest-browser hangs, Spine-Testing §7):
#     CT rides the `pnpm test` lane (green-to-PUSH — this bullet describes the pre-push hook; the
#     "GREEN-TO-COMMIT" doctrine term above is about `pnpm check` at pre-commit, a different tier),
#     e2e-smoke gates HERE. NOTE: needs Playwright chromium on the
#     pushing machine (`pnpm exec playwright install chromium` once); the sandbox can't push, so this fires
#     on the host.
#   • e2e ANTI-ROT (2026-07-12): the full e2e suite is manual (`pnpm e2e`) and CI is workflow_dispatch-only
#     (auto-triggers off, 2026-07-05 — the real gate is these hooks), so a smoke SUBSET gates HERE (the only
#     automated per-push surface). It boots the stack via playwright's webServer (reuses a running dev daemon,
#     else ~5s cold), then runs the `@smoke`-tagged specs — enough to catch the UI-selector/landing drift that
#     silently rotted the suite to 8/11-red. The live-model spec (`@live`) is EXCLUDED (never in any gate).
# Bypass for genuine emergencies only: `git commit --no-verify` / `git push --no-verify`.
#
# OUTPUT is tuned for agent/CI consumption (the recurring pain: lefthook's truecolor banner blew the
# commit output to ~30KB of ANSI, which truncates to a useless preview — you can't even tell the commit
# landed). `colors:false` drops lefthook's own ANSI; `output` keeps only the summary + a FAILED command's
# output (no banner or per-step chrome); `follow:true` on each long gate forwards its compact progress as
# it happens instead of withholding every byte until the command exits. `NO_COLOR:"1"` on each command
# makes the gate tools (Biome/tsc/depcruise/vitest) emit plain, greppable text. An interactive `pnpm check`
# in a TTY is unaffected (still colorizes).
colors: false
output:
  - summary
  - failure
  - execution_out

pre-commit:
  follow: true
  commands:
    check:
      run: pnpm check
      env:
        NO_COLOR: "1"

# The MERGE-commit twin of pre-commit (added 2026-08-01 — main went red twice in one day from exactly
# this hole): git runs `pre-merge-commit` (NOT `pre-commit`) for a NON-conflicted auto-merge commit
# (`git merge <branch>` that commits by itself), so merges skipped the gate entirely. A CONFLICTED merge
# concluded via `git commit` already runs pre-commit — this hook covers precisely the uncovered path.
# Same body as pre-commit: the merged working tree is in place when the hook fires, so `pnpm check`
# verdicts the exact tree the merge commit would snapshot. Bypass: `git merge --no-verify` (emergencies).
pre-merge-commit:
  follow: true
  commands:
    check:
      run: pnpm check
      env:
        NO_COLOR: "1"

# The RAW-`git worktree add` gap (added 2026-08-02). The WorktreeCreate agent hook installs deps for the
# worktrees IT creates; a worktree added by hand gets a tree with no `node_modules`, and then every gate
# LIES (§L rule 5 — `git worktree add` does not fire the install hook, so `pnpm check` runs against nothing).
# git DOES fire `post-checkout` in the new worktree (probed: cwd = the new tree, $1 = the null sha, $3 = 1),
# so this is the one place that gap can be closed generically.
#
# GUARDED TO A NO-OP ON EVERY NORMAL CHECKOUT — this hook fires on `git checkout <file>` too, and its exit
# status IS `git checkout`'s, so it must never be slow and never be red:
#   • `{3}` is git's third post-checkout argument — 1 = a BRANCH checkout (a switch, or a new worktree),
#     0 = a FILE checkout. Probed for all three shapes; lefthook templates the raw git args.
#   • `node_modules` present ⇒ nothing to do. So a plain branch switch on an installed tree does zero work,
#     and the install only runs on a tree that genuinely has no deps.
# The `if` exits 0 when the guard is false (no `|| true` — a FAILING install must stay visible, not be
# swallowed into a green checkout). ~3s from the store on the hit path.
#
# The `.git/hooks/post-checkout` FILE is synced by lefthook itself (config-checksum auto-sync on the next
# `lefthook run` / `pnpm install`'s `prepare`) — nothing to install by hand. One caveat, pre-existing and
# not fixable here: the generated hook script resolves the lefthook BINARY through `$worktree/node_modules`
# (plus a path baked in by whichever tree last ran `lefthook install`), so on a hand-added worktree whose
# baked path is dead this hook prints "Can't find lefthook in PATH" and exits 0 — the gap re-opens for that
# one case, and `pnpm install --prefer-offline` by hand is still the fallback (§L rule 5).
# Commit-message contract (2026-09-18): `type(scope): subject`, a body, and a well-formed
# `Co-Authored-By: Name <local@domain>` trailer. Cheap (pure bash, no toolchain), so it stays on even when a
# lane bypasses the whole-tree pre-commit under #1584 — and because a bypass skips THIS too, the orchestrator
# runs the same script at landing: `scripts/commit-msg-check.sh --range main..<branch>`. Rules + the
# ORB_HUMAN_COMMIT=1 owner waiver (trailer rule only) are in the script header.
commit-msg:
  commands:
    message-contract:
      run: bash scripts/commit-msg-check.sh {1}

post-checkout:
  commands:
    bootstrap-deps:
      run: if [ "{3}" = "1" ] && [ ! -d node_modules ]; then pnpm install --prefer-offline; fi
      env:
        NO_COLOR: "1"

# AUTO-LAND for the in-repo work items (docs/work/, `docs/plans/doc-system/design.md`). After a merge
# INTO main that `git merge` itself completes (a fast-forward or a clean `--no-ff`), `pnpm doc land
# --merged` reads the `Closes: 12, 14` trailers of the commits the merge brought in (ORIG_HEAD..HEAD),
# DELETES those items with the merge commit as evidence (the commit message records each one), regenerates
# the indexes and commits ONLY those paths (a pathspec commit, so a sibling's staged file never rides
# along) under the message contract (with the whole-tree check excluded, the standing exception
# spelling). On any other branch, or when no merged commit carries a trailer, it writes and prints
# nothing. An id already landed is skipped; an id neither on the tree nor landed in git refuses the whole
# batch and names the by-hand landing.
# THE GAP git LEAVES: a merge finished by a separate `git commit` — `--no-ff --no-commit` + `git commit`,
# or a conflict resolved the same way — runs NO post-merge hook; git only fires post-commit for it. The
# post-commit command below covers that gap: it is a no-op unless HEAD itself is a merge commit (a second
# parent), so an ordinary feature commit never touches it, and `land --merged` reads `HEAD^1..HEAD` for a
# merge commit instead of the post-merge-only `ORIG_HEAD..HEAD` (mergedCommits, tooling/src/doc/ops/tree.ts).
# landItems is idempotent — an already-landed id is skipped — so the rare case where both hooks would fire
# for the same merge costs nothing.
post-merge:
  commands:
    land-work-items:
      run: node tooling/src/doc/cli.ts land --merged
      env:
        NO_COLOR: "1"

post-commit:
  commands:
    land-merged-commit:
      run: if git rev-parse --verify -q HEAD^2 >/dev/null; then node tooling/src/doc/cli.ts land --merged; fi
      env:
        NO_COLOR: "1"

pre-push:
  follow: true
  commands:
    # The ONE push-tier command (V3 repoint): static + deps:orphan-ratchet + tests:node (`pnpm test` =
    # the configured vitest RUNTIME projects + the CT suite, merged 2026-07-17) + e2e-smoke + `quality:cpd`,
    # with the unified summary + max-severity exit. Replaces the 4-command piped pipe —
    # verify runs ALL stages and reports ALL failures, then exits max-severity.
    #
    # cpd PROMOTED here 2026-08-03 (measured 0.86s): it sat in `full` for historical reasons, not cost,
    # and a tier nobody invokes gates nothing. `tests:parity` rode here on the same promotion and was
    # REMOVED 2026-08-22 with the neo parity suite (#428 — the neo floor was exceeded; git preserves it).
    #
    # STILL NOT at push, both deliberately:
    #   • `quality:mutation-gate` — calibrated to `break: 50` on 2026-08-14, so it is a real regression
    #     gate. A current run takes roughly 72 minutes, though; it belongs in `full`, not in every push.
    #   • the full `browser:e2e` — the 2026-07-12 anti-rot ruling: the `@smoke` SUBSET gates every push,
    #     the full suite stays manual (`pnpm e2e`). Changing that is an owner call, not a drift.
    # Anything else claiming a different tier list is folklore — `tooling/src/verify/lib/registry.ts` is the
    # authority, and `pnpm verify --list` prints every stage with its tier.
    verify:push:
      run: pnpm verify --push
      env:
        NO_COLOR: "1"
