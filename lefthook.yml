min_version: 2.1.10
colors: false
output: [summary, failure, execution_out]

pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --error-on-warnings --no-errors-on-unmatched
    stylelint:
      glob: "*.css"
      run: pnpm exec stylelint {staged_files}
    # Hand-edited docs under the doc tool's trees get the tool's own formatting. A file the formatter
    # refuses is reported, never blocking: commits are not hard-blocked by this check, hence `|| true`.
    format-docs:
      glob: "docs/{adr,plans,work,law}/*.md"
      run: pnpm doc format --write {staged_files} || true
      stage_fixed: true

post-commit:
  commands:
    # `git commit -- <path>` commits from a temporary index, so stage_fixed restages the formatted text
    # there only: the real index keeps the unformatted text and status shows `MM`. Resetting such a doc to
    # HEAD leaves the formatted working copy as the clean state. Only a doc whose working copy already
    # equals HEAD is reset: a doc whose staged text differs from HEAD in the working copy too is another
    # change's staging (an amend with a pathspec), and a reset would drop it.
    restage-docs:
      run: |
        for f in $(git diff --cached --name-only -- 'docs/adr/*.md' 'docs/plans/*.md' 'docs/work/*.md' 'docs/law/*.md'); do
          if git diff --quiet HEAD -- "$f"; then git reset -q HEAD -- "$f"; fi
        done

pre-merge-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --error-on-warnings --no-errors-on-unmatched
    stylelint:
      glob: "*.css"
      run: pnpm exec stylelint {staged_files}

commit-msg:
  commands:
    message-contract:
      run: bash scripts/commit-msg-check.sh {1}

post-checkout:
  commands:
    bootstrap-deps:
      run: if [ "{3}" = "1" ] && [ ! -d node_modules ]; then pnpm install --prefer-offline; fi

pre-push:
  piped: true
  commands:
    github-sync-check:
      priority: 1
      run: bash scripts/github-sync.sh --check
    biome:
      priority: 2
      run: pnpm lint
    depcruise:
      priority: 3
      run: pnpm depcruise
    eslint:
      priority: 4
      run: pnpm lint:eslint
    knip:
      priority: 5
      run: pnpm knip
    knip-prod:
      priority: 6
      run: pnpm knip:prod
    typecheck:
      priority: 7
      run: pnpm typecheck
    # The tests that hold law, rule and comment citations true. The other tooling tests stay hand-run.
    doc-citations:
      priority: 8
      run: pnpm test:tools tests/tooling/doc/comment-path-citations.repo.int.test.ts tests/tooling/doc/dead-references.repo.int.test.ts tests/tooling/doc/law-directory-lists.repo.int.test.ts tests/tooling/law-rule-citations.test.ts
