# Lefthook — git hooks, worktree-safe by construction.
#
# Installed via the root `prepare: lefthook install` script, which runs on EVERY `pnpm install`
# (main checkout AND every worktree). `lefthook install` sets `core.hooksPath` in the SHARED git
# config (the common gitdir), and this file is tracked — so hooks fire in every worktree with zero
# per-worktree setup. Commands run from the worktree root (lefthook resolves it per-worktree), so a
# fresh worktree just needs `pnpm install` (or `pnpm run worktree:bootstrap`) and the gates work.
#
# GREEN-TO-COMMIT is enforced HERE, not by discipline (born-compliant doctrine — "won't pass check →
# won't commit"). The 2026-06-28 incident: test-FILE type errors (a DOM-only `BodyInit`, a bad
# WorkloadEvent literal) rode through ~10 commits because the old pre-commit ran ONLY Biome on staged
# files — and `pnpm check` (which runs `test:types`, the vitest typecheck lane that catches exactly
# those) only fired at pre-push, which never ran across a long no-push session.
#
# Split (type/structure gate at COMMIT, behavioral tests at PUSH):
#   • pre-commit → the full `pnpm check`: lint (Biome, whole repo) + per-package `tsc` + `test:types`
#     (vitest typecheck of the tests/ tree — the lane that was the blind spot) + check:structure
#     (the ts-morph gates) + dep-cruiser (all 5 packages). ~30s. A type/lint/boundary-red tree cannot
#     be committed. (No separate staged-Biome step — `pnpm check`'s lint covers the whole repo.)
#   • pre-push → `pnpm check` + `pnpm test` (unit/integration/contract, ~3.5min) + `pnpm test:ct` (the
#     Playwright CT suite, ~2-4min, `CT_GATE=1` so parallelism flakes retry instead of blocking) — the
#     full green bar before code leaves the machine; all kept off pre-commit only for commit speed. CTs
#     are the ONE class `pnpm check` can't hold (browser — vitest-browser hangs, Spine-Testing §7), so
#     they gate HERE, not at commit. NOTE: needs Playwright chromium on the pushing machine
#     (`pnpm exec playwright install chromium` once); the sandbox can't push, so this fires on the host.
# Bypass for genuine emergencies only: `git commit --no-verify` / `git push --no-verify`.
#
# OUTPUT is tuned for agent/CI consumption (the recurring pain: lefthook's truecolor banner blew the
# commit output to ~30KB of ANSI, which truncates to a useless preview — you can't even tell the commit
# landed). `colors:false` drops lefthook's own ANSI; `output` keeps only the summary + a FAILED command's
# output (no banner, no per-step chrome); `NO_COLOR:"1"` on each command makes the gate tools
# (Biome/tsc/depcruise/vitest) emit plain, greppable text. A pass is ~1 line; a fail shows the actual
# errors and nothing else. An interactive `pnpm check` in a TTY is unaffected (still colorizes).
colors: false
output:
  - summary
  - failure
  - execution_out

pre-commit:
  commands:
    check:
      run: pnpm check
      env:
        NO_COLOR: "1"

pre-push:
  piped: true
  commands:
    check:
      run: pnpm check
      env:
        NO_COLOR: "1"
    test:
      run: pnpm test
      env:
        NO_COLOR: "1"
    test:ct:
      run: pnpm test:ct
      env:
        NO_COLOR: "1"
        CT_GATE: "1"
