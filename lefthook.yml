min_version: 2.1.10
colors: false
output: [summary, failure, execution_out]

pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --diagnostic-level=error --no-errors-on-unmatched

pre-merge-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --diagnostic-level=error --no-errors-on-unmatched

commit-msg:
  commands:
    message-contract:
      run: bash scripts/commit-msg-check.sh {1}

post-checkout:
  commands:
    bootstrap-deps:
      run: if [ "{3}" = "1" ] && [ ! -d node_modules ]; then pnpm install --prefer-offline; fi

pre-push:
  commands:
    github-sync-check:
      run: bash scripts/github-sync.sh --check
