packages:
  - packages/*

# pnpm 11 gates packages with postinstall build scripts. Approve the ones we need:
# esbuild powers tsx + vitest; lefthook fetches its hook-runner binary.
allowBuilds:
  esbuild: true
  lefthook: true
  # sharp (infra/image): native libvips binding install/check — approve so the binary is wired on install.
  sharp: true
  # onnxruntime-node (infra/providers/backends/local-light): transformers.js's native ONNX runtime —
  # postinstall fetches the platform binary (CPU; CUDA EP when present). Approve so local-light can run.
  onnxruntime-node: true
  # @openrouter/sdk: the OR client's postinstall (setup/codegen) — approve so the backend resolves whole.
  "@openrouter/sdk": true
  # protobufjs: transitive via onnxruntime-node; its postinstall is non-critical but approved to silence
  # the ignored-build gate (no half-installed state).
  protobufjs: true

# Centralized version source of truth. package.json deps reference these via "catalog:".
# Versions are the latest resolved at scaffold (2026-06) — "use whatever the latest is".
catalog:
  # --- toolchain ---
  typescript: ^6.0.3
  "@biomejs/biome": ^2.5.1
  lefthook: ^2.1.9
  dependency-cruiser: ^18.0.0
  ts-morph: ^28.0.0
  tsx: ^4.22.4
  # @types/node tracks the RUNTIME (Node 24), not its own latest (26) — types must not lead the runtime.
  "@types/node": ^24
  # --- test ---
  vitest: ^4.1.9
  "@vitest/coverage-v8": ^4.1.9
  "@playwright/test": ^1.61.1
  "@playwright/experimental-ct-react": ^1.61.1
  # --- quality / mutation tooling ---
  # ts-reset: ambient type hardening (filter(Boolean), JSON.parse→unknown) — wired via root reset.d.ts.
  "@total-typescript/ts-reset": ^0.6.1
  # jscpd: copy-paste detection (CI gate, threshold 5%) — config jscpd.json.
  jscpd: ^5.0.11
  # stryker: mutation testing (scheduled — activates Phase 4+ when there's code+tests to mutate).
  "@stryker-mutator/core": ^9.6.1
  "@stryker-mutator/vitest-runner": ^9.6.1
  "@stryker-mutator/typescript-checker": ^9.6.1
  # --- kit (isomorphic libs allowed by the kit-purity ruling) ---
  zod: ^4.4.3
  typeid-js: ^1.2.0
  luxon: ^3.7.2
  "@types/luxon": ^3.7.2
  # remend: Vercel's streamdown markdown-repair engine (isomorphic, pure) — kit/fix-markdown.
  remend: ^1.3.0
  # --- db ---
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  "@libsql/client": ^0.17.4
  # --- server ---
  hono: ^4.12.27
  "@hono/node-server": ^2.0.6
  openid-client: ^6.8.4
  "@trpc/server": ^11.18.0
  # undici: the global-dispatcher seam for the SSRF egress firewall (infra/network/egress —
  # setGlobalDispatcher + Agent({connect.lookup})). Node's fetch is undici under the hood, but the
  # dispatcher swap requires the package; tracks Node 24's bundled undici major (7.x).
  undici: ^7.16.0
  # foundation/env — the sole process.env reader loads a local .env (override:true) before parsing.
  dotenv: ^16.4.7
  # --- foundation observability (Phase 4a — tiers/foundation.md › Runtime dependencies) ---
  # pino: the structured logger (pino.multistream([stdout, ringStream])).
  pino: ^10.3.1
  # pino-pretty: DEV-ONLY pipe for the dev script (never a configured prod transport — it would
  # double-serialize + starve the ring); prod emits raw JSON to stdout.
  pino-pretty: ^13.1.3
  # @opentelemetry/*: in-process spans + the RingExporter (OTLP-replaceable seam) + the ALS context
  # manager + the service.name/version resource attrs. We run the SDK, NOT the collector stack.
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/sdk-trace-base": ^2.8.0
  "@opentelemetry/context-async-hooks": ^2.7.1
  "@opentelemetry/resources": ^2.7.1
  "@opentelemetry/semantic-conventions": ^1.41.1
  # infra/image (Phase 4b — tiers/infra.md D6): the sharp adapter (decode/resize/format-normalize/
  # strip-metadata) behind the injected `imageTransform` op. Native libvips binding — pnpm builds it.
  sharp: ^0.34.4
  # --- infra/providers backends (Phase 4b-ii-b — tiers/providers.md) ---
  # @anthropic-ai/claude-agent-sdk: the agent-sdk backend (the Max sub + the OR-Anthropic skin + agent
  # mode). Its env firewall is the load-bearing credential seam (providers.md Esoteric §1).
  # `^0.3.206` floor — owner-approved force past the age gate 2026-07-10 (see minimumReleaseAgeExclude).
  "@anthropic-ai/claude-agent-sdk": ^0.3.206
  # @anthropic-ai/sdk: the anth-direct backend (D67) — the direct Anthropic-Messages wire over the
  # egress-firewalled global fetch. ALREADY in the tree as a transitive dep of the agent-sdk; promoted
  # to a direct dep to name the existing surface (installs nothing new).
  "@anthropic-ai/sdk": ^0.106.0
  # @openrouter/sdk: the openrouter backend (stateless chat.send / beta.responses + embed/rerank/image).
  # `^0.13.0` (not pinned to .20) so the minimumReleaseAge guard auto-picks the latest >24h-old 0.13.x.
  "@openrouter/sdk": ^0.13.0
  # @huggingface/transformers: the in-process local-light tier (transformers.js/ONNX, CPU+CUDA) — the
  # "any box" embed/rerank/imageEmbed path (D39). Pulls onnxruntime-node (native; allowBuilds-approved).
  "@huggingface/transformers": ^4.2.0
  # --- client ---
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  # --- ui (@orb/ui — the sealed satellites; versions verified against the registry 2026-07-02,
  #     deltas vs the docs recorded in proposed/ui-package-design.md §3) ---
  # Base UI v1 stable — the headless primitive (D42). NOT the dead rc-era @base-ui-components/react.
  "@base-ui/react": ^1.6.0
  # tailwind-variants: variants + slots + merge — subsumes cva/clsx (D54). DELTA vs D54: v3
  # externalized tailwind-merge to a PEER (>=3) — it rides inside @orb/ui's seal, never the client.
  tailwind-variants: ^3.2.2
  tailwind-merge: ^3.6.0
  # lucide-react: ^1.22 (not .23 — published <24h ago, blocked by minimumReleaseAge; bump when mature)
  lucide-react: ^1.22.0
  # TanStack Virtual ≥3.14.3: the directDomUpdates React-Compiler fix + core 3.16 chat APIs (D54).
  "@tanstack/react-virtual": ^3.14.5
  # Streamdown ≥2.5 — the D43 §6.3.1 version-floor build gate.
  streamdown: ^2.5.0
  # KaTeX math stack for @orb/ui/markdown's plugins.math (Streamdown ships mermaid bundled but NOT
  #   katex — these three are the math plugin's parse (remark-math) + render (rehype-katex) + the
  #   stylesheet/typesetting engine (katex). remark-gfm (^4 above) is also a @orb/ui direct dep for the
  #   singleTilde:false override.
  katex: ^0.16.25
  "remark-math": ^6.0.0
  "rehype-katex": ^7.0.1
  # Shiki, fine-grained (@orb/ui/markdown's plugins.code — streamdown 2.5 dropped bundled Shiki, D44
  #   §12/UI-Gates §11.6). `shiki` (the meta-package) is NOT installed: `@shikijs/core` +
  #   `@shikijs/engine-javascript` (the JS-regex engine, no WASM oniguruma) + `@shikijs/langs` (per-lang
  #   grammar entrypoints, dynamic-imported lazily per fence language) keep the highlighter tree-shaken
  #   to only what's actually rendered.
  "@shikijs/core": ^4.3.1
  "@shikijs/engine-javascript": ^4.3.1
  "@shikijs/langs": ^4.3.1
  codemirror: ^6.0.2
  "@codemirror/lang-css": ^6.3.1
  # jsdiff (docs said v8+; current major is 9 — same modern TS surface).
  diff: ^9.0.0
  # @codemirror/lint: A5 diagnostics layer (code-editor seal) — pinned direct (was transitive) so the
  #   seal imports it without a phantom dependency (biome noUndeclaredDependencies).
  "@codemirror/lint": ^6.9.7
  # @codemirror/state: pinned direct (was transitive, same reasoning) — the code-editor seal reaches
  #   it directly for EditorState.readOnly (state-gates paste/drop/command inserts; EditorView.editable
  #   alone only toggles contentEditable).
  "@codemirror/state": ^6.7.0
  # @codemirror/autocomplete: pinned direct (was transitive via `codemirror`'s basicSetup, same
  #   @codemirror/lint reasoning) — WS3 exposes a `completions` prop on the code-editor seal
  #   (autocompletion/completionSource) for the theme editor's CSS var inline autocomplete.
  "@codemirror/autocomplete": ^6.20.3
  # cmdk: the command-palette seal (primitives/command/). 1.1.1 (2025-03-14, mature).
  cmdk: ^1.1.1
  # @dnd-kit/react + helpers: the MODERN rewrite (0.5.0, 2026-06-11) for the sortable seal. NEVER
  #   @dnd-kit/core|sortable|utilities — the dead legacy stack (biome-banned).
  "@dnd-kit/react": ^0.5.0
  "@dnd-kit/helpers": ^0.5.0
  # @dnd-kit/dom: pinned direct (was transitive, the @codemirror/lint precedent) — the sortable
  #   seal reaches past @dnd-kit/react's public surface for the `Feedback` plugin class (not
  #   re-exported there) to configure the reduced-motion drop-animation override.
  "@dnd-kit/dom": ^0.5.0
  # echarts + echarts-for-react (D52, nivo replacement): the charts/ analytics seal. Tree-shaken
  #   imports only (echarts/core + used charts/components/renderers) — never `import "echarts"` whole.
  echarts: ^6.1.0
  "echarts-for-react": ^3.0.6
  # minisearch: the macro-textarea fuzzy-match seal (carve-out item 18).
  minisearch: ^7.2.0
  # toPlainText: markdown→plaintext previews via the same unified pipeline as Streamdown (D54).
  remark: ^15.0.1
  # docs formatter (scripts/docs/format-md.ts): frontmatter passthrough + compact GFM tables
  # (tablePipeAlign:false) — law in docs/architecture/core/Core-Docs-Formatting-Law.md.
  "remark-frontmatter": ^5.0.0
  "remark-gfm": ^4.0.1
  strip-markdown: ^6.0.0
  # DTCG token codegen (docs said v4; current major is 5 — ESM/async, DTCG first-class).
  style-dictionary: ^5.5.0
  # Tailwind v4 + the vite plugin (the @theme consumer; used by the CT harness + Phase-6 client).
  tailwindcss: ^4.3.2
  "@tailwindcss/vite": ^4.3.2
  # CT harness (playwright-ct bundles components via vite+react). Also the client build's react plugin.
  "@vitejs/plugin-react": ^6.0.3

  # --- client tooling: the ESLint gate + the @orb/client vite build (versions verified vs the live
  #     registry 2026-07-02; setup + rule enumeration + pin reasons in proposed/client-tooling-setup.md) ---
  # ESLint 10 is the NARROW supplement to biome (biome owns format + 400+ correctness rules): only the
  # rules biome can't do — react-hooks + React-Compiler diagnostics, TanStack Query/Router discipline,
  # tailwind compiled-class validation. Config: eslint.config.js (explicit-rules-only, no `recommended`).
  # Every plugin below peer-supports eslint ^10 (verified) and TS 6.0.3 (typescript-eslint peer <6.1.0).
  eslint: ^10.6.0
  # typescript-eslint: latest major-8 (there is NO v9); peer `typescript >=4.8.4 <6.1.0` → our 6.0.3 in range.
  # Used as PARSER only (+ the type-aware no-deprecated gate); its recommended RULE set stays OFF (biome+tsc own that).
  typescript-eslint: ^8.62.1
  # react-hooks v7 ships the React Compiler diagnostics (the rules-of-react correctness set) alongside rules-of-hooks.
  eslint-plugin-react-hooks: ^7.1.1
  "@tanstack/eslint-plugin-query": ^5.101.2
  "@tanstack/eslint-plugin-router": ^1.162.0
  # better-tailwindcss: validates class strings against the classes the v4 engine ACTUALLY registers
  # for our @theme (entryPoint = @orb/ui globals.css). Correctness rules only (biome owns class style/order).
  eslint-plugin-better-tailwindcss: ^4.6.0
  # tsdoc/syntax — validates TSDoc comment syntax (the Documentation-Law doc-comment gate). No eslint peer dep.
  eslint-plugin-tsdoc: ^0.5.2
  # vite: not 8.1.3 (published <24h ago, minimumReleaseAge-blocked); ^8.1.2 is the latest mature — the
  # caret auto-adopts 8.1.3 once it clears the 24h window. (Matches the lucide pin-reason style.)
  vite: ^8.1.2
  vite-plugin-checker: ^0.14.4
  # React Compiler (stable 1.0) runs FULL-compile from day one (D54). plugin-react v6 dropped internal
  # babel for oxc, so the compiler runs as a @rolldown/plugin-babel preset that MUST precede react().
  babel-plugin-react-compiler: ^1.0.0
  "@rolldown/plugin-babel": ^0.2.3
  # --- client data/forms/state (the Phase-6 client-foundation wave — UI-Primitives-and-Reuse.md §13.1
  #     primitives; versions per the UI-Lib-* mines' verified baselines, caret-adopted) ---
  "@tanstack/react-query": ^5.101.2
  "@tanstack/react-query-devtools": ^5.101.2
  "@tanstack/react-form": ^1.33.0
  zustand: ^5.0.14
  # @trpc/client + the tanstack-react-query bridge track @trpc/server's major (^11.18.0) — the
  # options-proxy (`trpc.x.y.queryOptions()`) IS the queryKey factory (gate no-array-literal-querykey).
  "@trpc/client": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  # @tanstack/react-router: the KEPT runtime (UI-Arch KEEP list "Router-minimal") — committed
  # production stack, used MINIMALLY (~3 hand-written code-based routes: / · /login · /admin/*).
  # 1.170.17 is <24h-blocked; ^1.170.16 is the latest mature (caret adopts newer once mature).
  # NB: the FILE-BASED codegen (@tanstack/router-plugin + @tanstack/router-cli + routeTree.gen.ts) is
  # DELIBERATELY DROPPED (UI-Arch §6.1, UI-Lib-TanStack-Router.md B#3/B#4): hand-written code-based
  # tree; type-safety = inference + one `declare module { Register }`, not codegen. The vite build does
  # NOT wire tanstackRouter(). See proposed/client-tooling-setup.md §4.
  "@tanstack/react-router": ^1.170.16
  # --- dev-only instrumentation (T5, scratch/dev-tooling-support-kit-plan.md): the unified TanStack
  #     Devtools shell + panels. Shell + vite strip-plugin are PRE-1.0 → EXACT pins (bump = read the
  #     changelog); router-devtools panel is stable (peer @tanstack/react-router ^1.170.16 satisfies).
  #     Runtime panels live in client `dependencies` (dep-cruiser not-to-dev-dep — they're imported
  #     from src/, DEV-gated + build-stripped); devtools-vite is config-only → devDependencies.
  "@tanstack/react-devtools": 0.10.8
  "@tanstack/react-router-devtools": ^1.167.0
  "@tanstack/devtools-vite": 0.8.1

# Force vite/vitest's bundled esbuild (0.25.x — rejects the `es2025` target) up to 0.28.1, which
# supports es2025, so the transform matches tsc's es2025 with no "Unrecognized target" warning. Scoped
# to the 0.25.x line so the ancient @esbuild-kit 0.18.20 (a tsx transitive) is left untouched.
overrides:
  "esbuild@^0.25.0": 0.28.1
  # Force the single @vitejs/plugin-react up to the catalog's v6 (vite-8-compatible). @playwright/
  # experimental-ct-react pins a transitive v4.7.0 whose vite peer maxes at ^7 → unmet-peer warning
  # against our vite 8. v6 is the only line that peers vite ^8, so we dedupe both the client build and
  # the CT harness onto it. (Alex-approved 2026-07-02: accept the CT-harness major-bump to clear the peer.)
  "@vitejs/plugin-react": "catalog:"

# Supply-chain delay: refuse versions published < 1440 min (24h) ago — a just-published malicious
# version is usually yanked within that window. (The Exclude was orphaned without this — the guard was
# OFF.) --frozen-lockfile installs are unaffected (no re-resolution); only new/updated deps are gated.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - dependency-cruiser@18.0.0
  # agent-sdk 0.3.206 (+ its 8 platform-binary siblings): owner-approved force past the age gate
  # 2026-07-10 (published ~20h prior). Version-pinned — the gate stays live for future releases.
  - "@anthropic-ai/claude-agent-sdk@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.206"
