  # rules biome can't do — react-hooks + React-Compiler diagnostics, TanStack Query/Router discipline,
  # tailwind compiled-class validation. Config: eslint.config.js (explicit-rules-only, no `recommended`).
  # Every plugin below peer-supports eslint ^10 (verified) and TS 6.0.3 (typescript-eslint peer <6.1.0).
  eslint: ^10.7.0
  # typescript-eslint: latest major-8 (there is NO v9); peer `typescript >=4.8.4 <6.1.0` → our 6.0.3 in range.
  # Used as PARSER only (+ the type-aware no-deprecated gate); its recommended RULE set stays OFF (biome+tsc own that).
  typescript-eslint: ^8.65.0
  # react-hooks v7 ships the React Compiler diagnostics (the rules-of-react correctness set) alongside rules-of-hooks.
  eslint-plugin-react-hooks: ^7.1.1
  "@tanstack/eslint-plugin-query": ^5.101.4
  "@tanstack/eslint-plugin-router": ^1.162.0
  # better-tailwindcss: validates class strings against the classes the v4 engine ACTUALLY registers
  # for our @theme (entryPoint = @orb/ui globals.css). Correctness rules only (biome owns class style/order).
  eslint-plugin-better-tailwindcss: ^4.7.0
  # tsdoc/syntax — validates TSDoc comment syntax (the doc-comment gate, .claude/rules/comments.md). No eslint peer dep.
  eslint-plugin-tsdoc: ^0.5.2
  # jsx-a11y — EXACT, not a caret, and that is the point (#1331). eslint.config.js spreads its `strict`
  # bundle, `lint:eslint` runs with `--max-warnings 0`, so any rule a 6.x MINOR adds to that bundle would
  # land as a hard `pnpm check` gate with no config change and no review. The spread is sanctioned ONLY
  # because this pin cannot move on its own; loosening it to `^` reopens the door the ack claims is shut.
  eslint-plugin-jsx-a11y: 6.10.2
  # eslint-react's leak family: unremoved listeners/timers/observers/fetch inside components — nothing
  # else in the stack (biome, react-hooks, tsc) can see a subscription that outlives its component.
  eslint-plugin-react-web-api: ^5.18.1
  # semantic unnecessary-effect analysis (the "you might not need an effect" family). 6 of 9 rules
  # enabled, 3 rejected with receipts — the reasoning lives in eslint.config.js beside the block.
  eslint-plugin-react-you-might-not-need-an-effect: ^1.0.1
  # vite: not 8.1.3 (published <24h ago, minimumReleaseAge-blocked); ^8.1.2 is the latest mature — the
  # caret auto-adopts 8.1.3 once it clears the 24h window. (Matches the lucide pin-reason style.)
  vite: ^8.1.2
  vite-plugin-checker: ^0.14.4
  # React Compiler (stable 1.0) runs FULL-compile from day one (D54). plugin-react v6 dropped internal
  # babel for oxc, so the compiler runs as a @rolldown/plugin-babel preset that MUST precede react().
  babel-plugin-react-compiler: ^1.0.0
  "@rolldown/plugin-babel": ^0.2.3
  # --- client data/forms/state (the Phase-6 client-foundation wave — UI-Primitives-and-Reuse.md §13.1
  #     primitives; versions per the UI-Lib-* mines' verified baselines, caret-adopted) ---
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-form": ^1.33.2
  zustand: ^5.0.14
  # @trpc/client + the tanstack-react-query bridge track @trpc/server's major (^11.18.0) — the
  # options-proxy (`trpc.x.y.queryOptions()`) IS the queryKey factory (gate no-array-literal-querykey).
  "@trpc/client": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  # @tanstack/react-router: the KEPT runtime (UI-Arch KEEP list "Router-minimal") — committed
  # production stack, used MINIMALLY (~3 hand-written code-based routes: / · /login · /admin/*).
  # 1.170.17 is <24h-blocked; ^1.170.16 is the latest mature (caret adopts newer once mature).
  # NB: the FILE-BASED codegen (@tanstack/router-plugin + @tanstack/router-cli + routeTree.gen.ts) is
  # DELIBERATELY DROPPED (UI-Arch §6.1): hand-written code-based
  # tree; type-safety = inference + one `declare module { Register }`, not codegen. The vite build does
  # NOT wire tanstackRouter().
  "@tanstack/react-router": ^1.170.16
# There is deliberately NO `esbuild@^0.25.0` override here any more (dropped 2026-08-07). It existed to
# force "vite/vitest's bundled esbuild" up to 0.28.1 so the es2025 target would not be rejected — and the
# vite 8 / vitest 4 bump killed BOTH halves of that premise. Re-derived from source, not from the comment:
# vite@8.1.2 does not DEPEND on esbuild at all (it is an OPTIONAL PEER, `^0.27.0 || ^0.28.0`) and only
# lazily `import("esbuild")`s for `build.cssMinify === "esbuild"` and the deprecated `transformWithEsbuild`
# — we use neither. `build.target: "es2025"` in packages/client/vite.config.ts is lowered by OXC/Rolldown,
# so no esbuild version can reject it; vitest 4 rides that same vite 8. The only packages left asking for
# the ^0.25 line were drizzle-kit (`^0.25.4`) and the CT harness's pinned vite 6 (`^0.25.0`) — neither has
# anything to do with es2025, and forcing two packages three minors past their declared range for a reason
# that no longer exists is a silent-breakage risk, not hygiene. Proven green without it on 2026-08-07:
# `pnpm install`, all three typecheck programs, a vitest suite, a playwright CT spec, and a full
# `pnpm --filter @orb/client build` (es2025 target, exit 0). Cost of removal: a third esbuild copy in the
# store (0.25.12 beside 0.18.20 and tsx's 0.28.1) — disk, not correctness.
overrides:
  # fast-uri is a pure transitive of ajv (nested under @modelcontextprotocol/sdk, itself under
  # @anthropic-ai/claude-agent-sdk) — no workspace package.json declares it, so `pnpm update` cannot
  # reach it (it only bumps packages declared by name in a manifest). Pin to a version already inside
  # ajv's own declared `fast-uri: ^3.0.1` range to clear GHSA-v2hh-gcrm-f6hx / GHSA-7p8r-x3mc-p8w7 /
  # GHSA-4c8g-83qw-93j6 (host-confusion via backslash/IDN authority parsing, all patched by 3.1.5).
  # Falls away on its own once ajv's declared floor moves past 3.1.5.
  fast-uri: ^3.1.5
  # ip-address is a pure transitive of express-rate-limit (same @modelcontextprotocol/sdk chain as
  # above) — same "no manifest names it" reason `pnpm update` can't reach it. Pin to a version already
  # inside express-rate-limit's own declared `ip-address: ^10.2.0` range to clear GHSA-mwp4-54f8-5fhr /
  # GHSA-4xrf-jv44-h6hh / GHSA-22jq-vg5j-6vgg (leading-zero-octet decode / CIDR-suffix / NAT64
  # special-use SSRF bypasses, all patched by 10.3.1). Falls away once express-rate-limit's declared
  # floor moves past 10.3.1.
  ip-address: ^10.3.1
  # @modelcontextprotocol/sdk declares its OWN `@hono/node-server: ^1.19.9` (a separate major line from
  # our own catalog `@hono/node-server: ^2.0.6` dep, so pnpm cannot dedupe the two) — same "no manifest
  # names the 1.x line by itself" reason `pnpm update` can't reach it. Pin to a version already inside
  # that declared range to clear GHSA-frvp-7c67-39w9 (Windows encoded-backslash path traversal in
  # serve-static, patched by 1.19.15). Falls away once @modelcontextprotocol/sdk's declared floor moves
  # past 1.19.15. SCOPED to the mcp-sdk>@hono/node-server chain — a bare `"@hono/node-server":` key
  # collapses BOTH major lines onto the 1.x pin, silently downgrading our own direct 2.x dependency.
  "@modelcontextprotocol/sdk>@hono/node-server": ^1.19.15
  # Force the single @vitejs/plugin-react up to the catalog's v6 (vite-8-compatible). @playwright/
  # experimental-ct-react pins a transitive v4.7.0 whose vite peer maxes at ^7 → unmet-peer warning
  # against our vite 8. v6 is the only line that peers vite ^8, so we dedupe both the client build and
  # the CT harness onto it. (Alex-approved 2026-07-02: accept the CT-harness major-bump to clear the peer.)
  "@vitejs/plugin-react": "catalog:"
  # @huggingface/transformers@4.2.0 declares its own `sharp: ^0.34.5` dependency (matching our own
  # pre-bump floor), which resolves to a separate 0.34.5 tree alongside our catalog `sharp: ^0.35.0` —
  # duplicating the GHSA-f88m-g3jw-g9cj-vulnerable version instead of deduping onto the fixed one.
  # Force the single resolution onto the catalog floor.
  sharp: "catalog:"
  # eslint-plugin-tsdoc@0.5.2 (latest) pins its own `@typescript-eslint/utils: ~8.56.0` dependency, whose
  # transitive peer `typescript >=4.8.4 <6.0.0` conflicts with our typescript@6.0.3 — `pnpm peers check`
  # DEPLOCK-02. The direct `typescript-eslint` catalog dep already resolves ^8.65.0, whose
  # `@typescript-eslint/utils` peers `typescript >=4.8.4 <6.1.0` (6.0.3 in range). Force the single
  # duplicate resolution onto that already-satisfied version rather than bump TS/ESLint themselves.
  "@typescript-eslint/utils": "8.65.0"
  # CT's vite is PINNED, not merely inherited. @playwright/experimental-ct-core depends on `vite: ^6`, so
  # this tree deliberately carries TWO vite majors: 8 for the @orb/client build, 6 for the CT harness.
  #
  # We tried to collapse them (spike 2026-08-07) by
  # overriding this same key to the catalog's vite 8. It BUILDS and then mounts NOTHING: 674 CT specs ran,
  # 670 reached retry2, every one failing `mount()` with a 30s timeout against a blank page, starting at
  # the very first spec. A/B'd on one file, same box, same load: vite 6 → 2 passed (27.9s); vite 8 → 2
  # failed, blank mount. playwright-ct's `playwright:component-index` plugin is written against vite 6's
  # build pipeline, and Rolldown's is not it.
  #
  # So the version is a STATED DECISION with a re-test trigger, not an accident of resolution: an exact
  # pin means a `@playwright/experimental-ct-*` bump can never silently move CT's vite underneath us.
  # RE-TEST CONDITION: on any playwright bump, check whether ct-core's vite range has moved to ^8 — if it
  # has, re-run the WHOLE CT suite on it, and only then consider collapsing to one vite.
  "@playwright/experimental-ct-core>vite": "6.4.3"
  # DEPLOCK 2026-08-14: streamdown@2.5.0 pins `mermaid: ^11.12.2`, resolved-stale at 11.16.0 —
  # 5 advisories fixed in 11.16.1 (prototype pollution x2, CSS injection, XY-chart + radar DoS).
  # Mermaid renders untrusted MODEL OUTPUT (streamdown fences in chat), so this is the reachable
  # arm of today's audit. mermaid's own `dompurify: ^3.3.3` range already covers the fixed 3.4.13
  # (was resolved-stale at 3.4.11) — bumping mermaid alone drags dompurify along; no separate
  # dompurify override needed. Both ranges are satisfied by streamdown's own deps, so this is a
  # pure resolution-bump, not an API-incompatible major. Even after the mermaid bump, pnpm kept
  # resolving dompurify to the pre-fix 3.4.11 (satisfies mermaid's `^3.3.3` range but is not the
  # newest satisfying version) — force it to the fixed 3.4.13 explicitly (2 advisories, incl. an
  # XSS via IN_PLACE hook removal).
  mermaid: ">=11.16.1"
  dompurify: ">=3.4.13"

# Supply-chain delay: refuse versions published < 1440 min (24h) ago — a just-published malicious
# version is usually yanked within that window. (The Exclude was orphaned without this — the guard was
# OFF.) --frozen-lockfile installs are unaffected (no re-resolution); only new/updated deps are gated.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - dependency-cruiser@18.0.0
  # agent-sdk 0.3.280 (+ its 8 platform-binary siblings): owner-approved force past the age gate
  # 2026-09-22 (published hours prior); its CLI 2.1.280 serves claude-opus-5-5 and claude-fable-5-1.
  # Version-pinned — the gate stays live for future releases.
  - "@anthropic-ai/claude-agent-sdk@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280"
patchedDependencies:
  '@stryker-mutator/core@10.0.0': patches/@stryker-mutator__core@10.0.0.patch
  '@stryker-mutator/typescript-checker@10.0.0': patches/@stryker-mutator__typescript-checker@10.0.0.patch
  chrome-devtools-mcp@1.8.0: patches/chrome-devtools-mcp@1.8.0.patch

nodeOptions: "--max-old-space-size=16384"
