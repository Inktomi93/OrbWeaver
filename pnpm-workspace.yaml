# There is deliberately NO `esbuild@^0.25.0` override here any more (dropped 2026-08-07). It existed to
# force "vite/vitest's bundled esbuild" up to 0.28.1 so the es2025 target would not be rejected — and the
# vite 8 / vitest 4 bump killed BOTH halves of that premise. Re-derived from source, not from the comment:
# vite@8.1.2 does not DEPEND on esbuild at all (it is an OPTIONAL PEER, `^0.27.0 || ^0.28.0`) and only
# lazily `import("esbuild")`s for `build.cssMinify === "esbuild"` and the deprecated `transformWithEsbuild`
# — we use neither. `build.target: "es2025"` in packages/client/vite.config.ts is lowered by OXC/Rolldown,
# so no esbuild version can reject it; vitest 4 rides that same vite 8. The only packages left asking for
# the ^0.25 line were drizzle-kit (`^0.25.4`) and the CT harness's pinned vite 6 (`^0.25.0`) — neither has
# anything to do with es2025, and forcing two packages three minors past their declared range for a reason
# that no longer exists is a silent-breakage risk, not hygiene. Proven green without it on 2026-08-07:
# `pnpm install`, all three typecheck programs, a vitest suite, a playwright CT spec, and a full
# `pnpm --filter @orb/client build` (es2025 target, exit 0). Cost of removal: a third esbuild copy in the
# store (0.25.12 beside 0.18.20 and tsx's 0.28.1) — disk, not correctness.
overrides:
  # Force the single @vitejs/plugin-react up to the catalog's v6 (vite-8-compatible). @playwright/
  # experimental-ct-react pins a transitive v4.7.0 whose vite peer maxes at ^7 → unmet-peer warning
  # against our vite 8. v6 is the only line that peers vite ^8, so we dedupe both the client build and
  # the CT harness onto it. (Alex-approved 2026-07-02: accept the CT-harness major-bump to clear the peer.)
  "@vitejs/plugin-react": "catalog:"
  # @huggingface/transformers@4.2.0 declares its own `sharp: ^0.34.5` dependency (matching our own
  # pre-bump floor), which resolves to a separate 0.34.5 tree alongside our catalog `sharp: ^0.35.0` —
  # duplicating the GHSA-f88m-g3jw-g9cj-vulnerable version instead of deduping onto the fixed one.
  # Force the single resolution onto the catalog floor.
  sharp: "catalog:"
  # eslint-plugin-tsdoc@0.5.2 (latest) pins its own `@typescript-eslint/utils: ~8.56.0` dependency, whose
  # transitive peer `typescript >=4.8.4 <6.0.0` conflicts with our typescript@6.0.3 — `pnpm peers check`
  # DEPLOCK-02. The direct `typescript-eslint` catalog dep already resolves ^8.65.0, whose
  # `@typescript-eslint/utils` peers `typescript >=4.8.4 <6.1.0` (6.0.3 in range). Force the single
  # duplicate resolution onto that already-satisfied version rather than bump TS/ESLint themselves.
  "@typescript-eslint/utils": "8.65.0"
  # CT's vite is PINNED, not merely inherited. @playwright/experimental-ct-core depends on `vite: ^6`, so
  # this tree deliberately carries TWO vite majors: 8 for the @orb/client build, 6 for the CT harness.
  #
  # We tried to collapse them (spike 2026-08-07, docs/reviews/misc/2026-08-07-ct-vite-8-spike.md) by
  # overriding this same key to the catalog's vite 8. It BUILDS and then mounts NOTHING: 674 CT specs ran,
  # 670 reached retry2, every one failing `mount()` with a 30s timeout against a blank page, starting at
  # the very first spec. A/B'd on one file, same box, same load: vite 6 → 2 passed (27.9s); vite 8 → 2
  # failed, blank mount. playwright-ct's `playwright:component-index` plugin is written against vite 6's
  # build pipeline, and Rolldown's is not it.
  #
  # So the version is a STATED DECISION with a re-test trigger, not an accident of resolution: an exact
  # pin means a `@playwright/experimental-ct-*` bump can never silently move CT's vite underneath us.
  # RE-TEST CONDITION: on any playwright bump, check whether ct-core's vite range has moved to ^8 — if it
  # has, re-run the WHOLE CT suite on it, and only then consider collapsing to one vite.
  "@playwright/experimental-ct-core>vite": "6.4.3"
  # DEPLOCK 2026-08-14: streamdown@2.5.0 pins `mermaid: ^11.12.2`, resolved-stale at 11.16.0 —
  # 5 advisories fixed in 11.16.1 (prototype pollution x2, CSS injection, XY-chart + radar DoS).
  # Mermaid renders untrusted MODEL OUTPUT (streamdown fences in chat), so this is the reachable
  # arm of today's audit. mermaid's own `dompurify: ^3.3.3` range already covers the fixed 3.4.13
  # (was resolved-stale at 3.4.11) — bumping mermaid alone drags dompurify along; no separate
  # dompurify override needed. Both ranges are satisfied by streamdown's own deps, so this is a
  # pure resolution-bump, not an API-incompatible major. Even after the mermaid bump, pnpm kept
  # resolving dompurify to the pre-fix 3.4.11 (satisfies mermaid's `^3.3.3` range but is not the
  # newest satisfying version) — force it to the fixed 3.4.13 explicitly (2 advisories, incl. an
  # XSS via IN_PLACE hook removal).
  mermaid: ">=11.16.1"
  dompurify: ">=3.4.13"

# Supply-chain delay: refuse versions published < 1440 min (24h) ago — a just-published malicious
# version is usually yanked within that window. (The Exclude was orphaned without this — the guard was
# OFF.) --frozen-lockfile installs are unaffected (no re-resolution); only new/updated deps are gated.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - dependency-cruiser@18.0.0
  # agent-sdk 0.3.206 (+ its 8 platform-binary siblings): owner-approved force past the age gate
  # 2026-07-10 (published ~20h prior). Version-pinned — the gate stays live for future releases.
  - "@anthropic-ai/claude-agent-sdk@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.206"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.206"
