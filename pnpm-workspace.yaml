packages:
  - packages/*
  # The tool fleet (@orb/tooling) — ABOVE the cake, never imported by packages/* (docs/law/Core-Tooling-Law.md).
  - tooling

# The node-26 floor is a WALL, not a wish (node-26 adoption program §1.3, 2026-08-03). All seven manifests
# (root + the six workspace packages) declare `"engines": { "node": ">=26" }`; THIS line is what makes an
# install on a wrong major FAIL instead of proceeding — before it, the floor was declarative-only.
#
# It MUST live here and NOWHERE else. Probe-verified 2026-08-03 on pnpm 11.15.1, four arms against an
# unsatisfiable `engines: {node: ">=99"}` with a real dependency: `.npmrc` `engine-strict=true` alone →
# exit 0, INSTALLED; this key alone → exit 1 with the version-incompatible error; both → exit 1 (this key
# is doing the work); control (`>=26`, satisfiable) → exit 0, no false positive. pnpm 10.6+ moved its
# settings out of `.npmrc`, so an `.npmrc` `engine-strict` would be worse than nothing — the next reader
# greps it, finds it, and believes a wall exists. There is deliberately NO root `.npmrc`: this repo is
# pnpm-only (`packageManager` pins it, every script is `pnpm`), so an npm-CLI belt guards a scenario that
# does not occur here.
engineStrict: true

# pnpm gates packages with postinstall build scripts. Approve the ones we need:
# esbuild powers drizzle-kit and the CT harness's vite 6 (NOT vitest any more — vitest 4 rides
# vite 8, which transforms with Oxc; corrected 2026-08-07); lefthook fetches its hook-runner binary.
allowBuilds:
  esbuild: true
  lefthook: true
  # sharp (infra/image): native libvips binding install/check — approve so the binary is wired on install.
  sharp: true
  # onnxruntime-node (@orb/inference's local-light backend): DENIED. The tarball already carries the CPU
  # binding for every platform local-light runs on. Its postinstall only fetches the CUDA 12 providers from
  # api.nuget.org on linux-x64, and a failed fetch fails the whole install. local-light is the CPU tier, and
  # model-cache.ts retries a failed device on cpu. tests/tooling/install-builds.int.test.ts pins this.
  onnxruntime-node: false
  # protobufjs: transitive via onnxruntime-web; its postinstall is non-critical but approved to silence
  # the ignored-build gate (no half-installed state).
  protobufjs: true
  # cloudflared (infra/relay): DENIED. Its postinstall downloads the unpinned latest cloudflared with no checksum;
  # the relay controller downloads the pinned version and verifies it (`infra/relay/pin.ts`).
  cloudflared: false

# The one home for dependency versions: every package.json names "catalog:" (or "workspace:*"), never a
# version. The toolchain pins pnpm reads only from the root package.json: `packageManager`.
# Versions are the latest resolved at scaffold (2026-06) — "use whatever the latest is".
catalog:
  # --- toolchain ---
  # cross-spawn: niced-exec.ts's win32 child spawn (proc.ts#spawnFullPriorityChild) — resolves and quotes
  # a `.cmd`/`.bat` npm-bin shim correctly; a bare `spawn` there cannot resolve PATHEXT, and our own hand
  # rolled quoting was a second, narrower home for the same problem. Already in the lockfile as a
  # transitive dependency of several dev tools; pinned exact so a transitive bump cannot silently change
  # our own Windows escaping.
  cross-spawn: 7.0.6
  "@types/cross-spawn": ^6.0.6
  knip: ^6.27.0
  yaml: 2.9.0
  "@typescript/native": npm:typescript@7.0.2
  ts7: npm:typescript@7.0.2
  "@eslint/config-array": 0.23.5
  typescript: ^6.0.3
  "@biomejs/biome": 2.5.1
  lefthook: ^2.1.10
  dependency-cruiser: ^18.1.0
  ts-morph: ^28.0.0
  # @types/node tracks the RUNTIME (Node 26).
  "@types/node": ^26.1.1
  # --- test ---
  # Typecheck integration is experimental; validate upgrades explicitly and keep coverage in lockstep.
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
  "@playwright/test": ^1.61.1
  "@playwright/experimental-ct-react": ^1.61.1
  # --- rendered instruments ---
  # lighthouse: the audit ENGINE the retired chrome-devtools MCP wrapped (#1195/#1198). WHY THE DEPENDENCY
  # IS WORTH IT (every dependency is a liability): the retirement census
  # counted 41 `lighthouse_audit` MCP calls in 14 days and it was the ONLY MCP tool producing findings
  # snap could not — axe's `label-content-name-mismatch` (3 nodes on the plugins pane) and `target-size`.
  # Owning the engine retires a whole MCP server for one dev-only @orb/tooling dep that ships to nobody.
  # The caret is deliberate but NOT free: snap reads audit ids and the `details.items[].node.selector`
  # shape, so a minor bump owes a re-run of tests/tooling/snap/ops/lighthouse.int.test.ts (it pins the
  # audit BY NAME) before it is trusted.
  lighthouse: ^13.4.1
  # puppeteer-core: NOT a second browser — the ATTACH surface. Lighthouse drives a puppeteer Page
  # (`page.target().createCDPSession()` + a wildcard protocol listener), so snap connects puppeteer to the
  # SAME chromium Playwright already launched, over its `--remote-debugging-port` endpoint, and hands
  # Lighthouse the handle for the exact target being driven (tooling/src/snap/ops/lighthouse.ts). Already
  # in the tree as lighthouse's own dependency; PINNED EXACT TO LIGHTHOUSE'S RESOLUTION so the two share
  # one installed copy — a drift here silently gives Lighthouse a page from a different puppeteer build.
  # Re-derive this pin on every `lighthouse` bump (`pnpm why puppeteer-core`).
  "puppeteer-core": 25.9.0
  # chrome-devtools-mcp: PARSER ENGINE ONLY for Snap's heap arm (#1300). Snap never imports or starts
  # the MCP server, transport, Puppeteer page, or browser launcher. One adapter deep-imports the bundled
  # browser-free HeapSnapshotManager so retained sizes, dominators, native-context attribution and
  # retaining paths use the same official DevTools algorithms instead of a home-grown graph parser.
  # Exact-pin: the published package has no supported parser export, so the adapter's module/method shape
  # and Apache-2.0 provenance are compatibility obligations. The version-keyed pnpm patch diverts the
  # worker's official weak-root problem reports into Snap's structured sidecar instead of dumping dozens
  # of lines to stderr; it changes no graph algorithm. Any bump owes re-deriving that patch plus the
  # planted installed-subpath parse in the heap suite; there is deliberately no fallback parser.
  chrome-devtools-mcp: 1.8.0
  # --- quality / mutation tooling ---
  # ts-reset: ambient type hardening (filter(Boolean), JSON.parse→unknown) — wired via root reset.d.ts.
  "@total-typescript/ts-reset": ^0.6.1
  # jscpd: copy-paste detection (CI gate, threshold 5%) — config jscpd.json.
  jscpd: ^5.0.12
  # stryker: mutation testing (run via `pnpm test:mutation` / `pnpm test:mutation:gate` = a plain
  # `stryker run <config>` from the repo root — no wrapper, no --inPlace: Stryker copies into .stryker-tmp/,
  # the working tree is never touched, reports land in reports/ natively). PINNED EXACT to 10.0.0 (no caret) —
  # patches/@stryker-mutator__core@10.0.0.patch rewires the sandbox's workspace symlinks (stock StrykerJS
  # never rewires pnpm's WORKSPACE symlinks, so every @orb/* import escapes the sandbox → "No tests were
  # executed" / silent zero coverage) and is BYTE-SPECIFIC to 10.0.0's dist/src/sandbox/sandbox.js; a caret
  # bump to 10.1.x would silently invalidate the patch (install fails to apply / sandbox escape returns). The
  # patch APPLIES AUTOMATICALLY on `pnpm install` (patchedDependencies below) — a fresh clone just works.
  # THE PATCH KEY IS VERSION-KEYED: `patchedDependencies` names the EXACT version, so a bump that forgets to
  # re-derive silently stops patching and the sandbox escape returns as a clean-looking run over UNMUTATED
  # code. The MANDATORY proof after any bump is a planted control: mutate one kit file and confirm mutants
  # ACTIVATE AND DIE (non-zero killed) — a bare green proves nothing. (2026-08-21, the 9.6.1 → 10.0.0 bump:
  # v10's sandbox.js differs from 9.6.1 only in the --inPlace dispose() path; all three hunks re-applied with
  # line offsets, fileUtils exports unchanged. Node floor 22+; the box runs 26.5. Control receipt: 47 mutants
  # over packages/kit/src/macro/engine.ts — 17 killed / 1 timeout / 7 survived / 2 no-coverage / 20 compile-
  # error, score 66.67 total. Killed > 0 through an `@orb/kit/*` import IS the proof the sandbox rewire is
  # live; the pre-patch failure mode is "No tests were executed" / every mutant surviving.)
  # THE CORE PATCH CARRIES A SECOND, INDEPENDENT HUNK since #2505 (2026-09-20): `dist/src/utils/file-utils.js`
  # `findNodeModulesList`. That walk is a bare BFS over `readdir` rooted at `process.cwd()` (sandbox.js, under
  # Stryker's own `// TODO: Change with this.options.basePath when we have it`) and it consults NO Stryker
  # option but `tempDirName` — so `ignorePatterns`, where `tooling/src/_shared/stryker-config.ts` already lists
  # `.claude/**`, CANNOT REACH IT. Unfenced it finds `.claude/worktrees/<lane>/node_modules` and the sandbox
  # symlinks other agents' modules into the mutation run (reproduced against stock 10.0.0: with one planted
  # worktree the walk returned two of its trees), and a lane swept mid-walk turns an enumerated path into an
  # uncaught ENOENT that kills node before the first mutant — which is how the gate spent its life reporting
  # exit 1 over ZERO tested mutants. The hunk fences dot-directories and skips a vanished subtree. ITS KEEPER
  # IS `tests/tooling/stryker-sandbox-walk.int.test.ts`, which pins the INSTALLED package in both directions;
  # the exit-class half is `tooling/src/verify/lib/mutation-gate-verdict.ts`. It RETIRES when
  # `findNodeModulesList` honours `options.basePath`.
  # Keep all four in lockstep at 10.0.0 (core + vitest-runner + typescript-checker + api — the api package is
  # a DIRECT dep because scripts/mutation/arid-ignorer.ts imports its plugin surface). To bump: re-derive the
  # patch (`pnpm patch @stryker-mutator/core@<new>`,
  # re-apply the symlink rewire AND the walk fence, `pnpm patch-commit`), then move all three pins together,
  # then RE-RUN THE PLANTED CONTROL. Deep reference (root cause at file:line, the exact diff, the A/B/C/D validation matrix)
  # lives in the generated mutation-run report, not a tracked doc — re-run stryker to regenerate it.
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "@stryker-mutator/typescript-checker": 10.0.0
  # api: the PLUGIN surface (declareValuePlugin / PluginKind / Ignorer). A direct dep only because we ship
  # our own ignore-plugin (scripts/mutation/arid-ignorer.ts); core/runner/checker pull it transitively.
  # the babel parser Stryker instruments with — declared so the arid ignorer's REAL-AST pin can
  # parse exactly what the mutator sees, instead of asserting against hand-built nodes.
  "@babel/parser": 7.29.7
  "@stryker-mutator/api": 10.0.0
  # SECOND PATCH, same version-keying hazard as the sandbox one:
  # patches/@stryker-mutator__typescript-checker@10.0.0.patch is a ONE-LINE fix to the TypeScript 7 native
  # checker preview. `ts-native/native-typescript-compiler.js` registered the SANITIZED tsconfig (the
  # allowUnreachableCode/noUnusedLocals/noUnusedParameters overrides that mutation testing REQUIRES —
  # stryker-js#391) under the RAW `options.tsconfigFile` string, while the compiler opens the RESOLVED
  # absolute path; the lookup missed and the compiler fell back to the on-disk STRICT tsconfig. Effect: the
  # entire `if (cond)` -> `if (false)` mutant class was disqualified as CompileError (TS7027) and left the
  # score's denominator, and the repeated disk fallback made the run 3x slower. The patch defaults the
  # parameter to the resolved name. Fixed, the native checker matches the classic verdict exactly at
  # classic-or-better speed (measurements from the mutation-config calibration pass). The native checker
  # also needs the `@typescript/native` -> npm:typescript@7 alias in the ROOT devDependencies (its loader
  # imports `@typescript/native/unstable/sync`; the alias its own error message recommends is never read).
  # The two patches + the four pins + that alias move TOGETHER on any bump, and the planted control below
  # is what proves the sandbox half still works afterwards.
  # --- kit (isomorphic libs allowed by the kit-purity ruling) ---
  zod: ^4.4.3
  typeid-js: ^1.2.0
  luxon: ^3.7.2
  "@types/luxon": ^3.7.2
  # @marcbachmann/cel-js: the CEL expression evaluator (isomorphic, pure — no node:*) behind the
  # @orb/kit/cel seam; automation predicates + {{expr}}. Bundled types.
  "@marcbachmann/cel-js": ^8.0.0
  # --- db ---
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  "@libsql/client": ^0.17.4
  # --- server ---
  hono: ^4.12.31
  "@hono/node-server": ^2.0.6
  openid-client: ^6.8.4
  # cloudflared: the quick-tunnel process wrapper only (`Tunnel.quick`, `use`, its output and exit events). Exact pin:
  # the wrapper spawns and signals the binary. Never its installer; allowBuilds above denies its postinstall.
  cloudflared: 0.7.3
  # acme-client (infra/acme): the ACME protocol client for the IP certificate (leg C, D269). Used through its low-level
  # API only: its auto() helper types every identifier as dns. Exact pin: the adapter passes a profile field through
  # createOrder and relies on the forge backend's iPAddress SAN, neither of which upstream documents.
  acme-client: 5.4.0
  # jose: the JWKS/JWT VERIFY side of forward-header auth (infra/auth/jwks — createLocalJWKSet/
  # createRemoteJWKSet + jwtVerify with a pinned RS256/ES256 allowlist). Already in the tree as an
  # openid-client transitive; promoted to a direct @orb/server dep to name the verify surface
  # (docs/law/Tier-5-Entry.md: mint = openid-client at entry, verify = jose at infra).
  jose: ^6.2.3
  "@trpc/server": ^11.18.0
  # undici: the global-dispatcher seam for the SSRF egress firewall (infra/network/egress —
  # setGlobalDispatcher + Agent({connect.lookup})). Node's fetch is undici under the hood, but the
  # dispatcher swap requires the package; tracks Node 26's bundled undici major (node 26.5 bundles
  # 8.7.0). MAJOR-DRIFT IS A SECURITY BUG, NOT A CHORE: this package and node's bundled copy hand off
  # through the SHARED symbol `Symbol.for("undici.globalDispatcher.1")` — our copy WRITES it,
  # node's built-in `fetch` READS it. If that contract ever breaks, the firewall silently stops
  # governing `fetch` and every gate stays green over an open SSRF surface. The tripwire that makes
  # the break LOUD is `tests/server/infra/network/dispatcher-contract.int.test.ts` — keep it passing,
  # and re-run it on every node/undici bump. Mirrored into root devDependencies so that test can
  # import this exact package (pnpm-strict hides a packages/server dep from tests/).
  # ^8.9.0 (not 8.10.0 — published <24h ago, minimumReleaseAge-blocked); 8.9.0 is the latest mature 8.x
  # and the caret floats to 8.10.0 on the next install once it ages past the gate.
  undici: ^8.9.0
  # --- foundation observability (Phase 4a — Tier-2-Foundation.md › Runtime dependencies) ---
  # pino: the structured logger (pino.multistream([stdout, ringStream])).
  pino: ^10.3.1
  # pino-pretty: DEV-ONLY pipe for the dev script (never a configured prod transport — it would
