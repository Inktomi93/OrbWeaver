# ── overlay: secrets as mounted FILES (never env values) ─────────────────────────────────────────────
#
#   mkdir -p /etc/orbweaver/secrets && cd /etc/orbweaver/secrets
#   openssl rand -hex 32 > session_secret ; openssl rand -hex 32 > credentials_key
#   touch local_initial_password oidc_client_secret openrouter_api_key claude_oauth_token   # empty = unset
#   chmod 600 *
#   ORB_SECRETS_DIR=/etc/orbweaver/secrets docker compose -f docker-compose.yaml -f docker/compose.secrets.yaml up -d
#
# An env value reads back out of `docker inspect`; a mounted file does not. Every file below must EXIST
# (compose refuses a missing secret file); the entrypoint treats an EMPTY file as unset, and an explicit env
# value wins over the file. Which file feeds which mode: docker/secrets/README.md.
services:
  orbweaver:
    secrets:
      - session_secret
      - local_initial_password
      - oidc_client_secret
      - credentials_key
      - openrouter_api_key
      - claude_oauth_token
    environment:
      SESSION_SECRET_FILE: /run/secrets/session_secret
      LOCAL_INITIAL_PASSWORD_FILE: /run/secrets/local_initial_password
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      CREDENTIALS_KEY_FILE: /run/secrets/credentials_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      CLAUDE_CODE_OAUTH_TOKEN_FILE: /run/secrets/claude_oauth_token

secrets:
  session_secret:
    file: ${ORB_SECRETS_DIR:-./docker/secrets}/session_secret
  local_initial_password:
    file: ${ORB_SECRETS_DIR:-./docker/secrets}/local_initial_password
  oidc_client_secret:
    file: ${ORB_SECRETS_DIR:-./docker/secrets}/oidc_client_secret
  credentials_key:
    file: ${ORB_SECRETS_DIR:-./docker/secrets}/credentials_key
  openrouter_api_key:
    file: ${ORB_SECRETS_DIR:-./docker/secrets}/openrouter_api_key
  claude_oauth_token:
    file: ${ORB_SECRETS_DIR:-./docker/secrets}/claude_oauth_token
