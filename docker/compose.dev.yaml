# ── overlay: the DEVELOPMENT stack from this checkout, inside a container ───────────────────────────
#
#   docker compose -f docker-compose.yaml -f docker/compose.dev.yaml up
#   → http://localhost:5173 (vite, hot reload)   API http://localhost:8788   logs in the terminal
#
# Same code path as bare metal (`pnpm stack start-fg`: the watched server + vite + the dev pins — single-user,
# dev-only secrets, seeded persona), with node + pnpm supplied by the container instead of your machine.
# Your checkout is bind-mounted, so edits reload live; `node_modules` is installed INTO the checkout on the
# first boot (a fresh clone has none — this is what puts them there) and reused after.
#
# Host networking is REQUIRED, not a preference: a development server binds loopback by design
# (foundation/env/bind.ts — a dev build must not be reachable off-box) and the owner fallback needs a
# loopback peer, so a bridge-published port would answer 502/401. Docker Engine on Linux and Podman; Docker
# Desktop needs its opt-in host networking (see compose.host-network.yaml) and is unverified.
#
# Ports: PORT / VITE_PORT (ORB_PORT / ORB_VITE_PORT here) when 8788/5173 are busy — e.g. a native dev stack
# on the same machine. Do not run this and `pnpm stack up` from the SAME checkout at once: they would share
# `.cache/stack`; this overlay uses its own run dir (`.cache/stack-docker`) so status/pidfiles cannot collide,
# but the ports still would.
services:
  orbweaver:
    image: node:26-bookworm@sha256:0353e48e0e8a993db87b720c242f54b207059d1bcc0106534896e8a11054c837
    build: !reset null
    container_name: orbweaver-dev
    hostname: orbweaver-dev
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    env_file: !reset []                     # the dev stack pins its own env; the production defaults would fight it
    read_only: false
    tmpfs: !reset []
    cap_drop: !reset []
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"     # writes into YOUR checkout, so it must be your uid
    working_dir: /app
    entrypoint: ["bash", "docker/dev-entrypoint.sh"]
    command: ["pnpm", "stack", "start-fg"]
    environment:
      BIND_HOST: !reset null                # the base container bind; a development build binds loopback only
      HOME: /app/.cache/docker-dev-home     # pnpm + its store live inside the checkout's gitignored .cache
      STACK_RUN_DIR: /app/.cache/stack-docker
      PORT: ${ORB_PORT:-8788}
      VITE_PORT: ${ORB_VITE_PORT:-5173}
    volumes: !override                      # ONLY the checkout — the base file's data volume must not shadow ./data
      - .:/app
