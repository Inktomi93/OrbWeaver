# ── overlay: a named Cloudflare Tunnel on your own hostname, in its own container ───────────────────
#
#   CLOUDFLARE_TUNNEL_TOKEN=<your tunnel token> docker compose -f docker-compose.yaml -f docker/compose.cloudflared.yaml up -d
#
# The tunnel dials OUT to Cloudflare; nothing is published and no router port is opened. In the Cloudflare
# dashboard (Zero Trust → Networks → Tunnels) create a tunnel, copy its token, and add a public hostname whose
# service is http://orbweaver:8788 — the compose service name on this project's network.
#
# NEEDS A LOGIN MODE. Every tunnelled request carries forwarding headers, so under the shipped single-user
# default it is never the owner and answers 401. In docker/orbweaver.local.env set these lines (Settings >
# Admin > Multi-user, Who can sign in, prints them for each mode):
#   AUTH_MODE=local
#   AUTH_FALLBACK=deny
#   AUTH_FALLBACK_TRUSTED_PEERS=
# Cloudflare sends X-Forwarded-Proto: https from a private address on this network, so the session cookie is
# Secure. Full recipe: docker/README.md, "From the internet: a tunnel".
#
# NEEDS THE HOSTNAME ALLOWED. The app refuses a name it does not know. In the same file set
# ALLOWED_HOSTS=<the public hostname>. Use a dot-led suffix only for a domain whose DNS you control.
#
# For a one-press link with no account, use the Share card instead (docker/README.md, "Share with one press").
#
# The token rides in the environment, so `docker inspect` shows it. To keep it in a file, mount one and set
# TUNNEL_TOKEN_FILE instead (cloudflared reads either).
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "run"]              # the image's entrypoint is `cloudflared --no-autoupdate`
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN to your tunnel token}
    depends_on: [orbweaver]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
