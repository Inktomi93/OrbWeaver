name: Bug report
description: Something in Orbweaver is broken or behaves wrongly.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        The **Report a bug** button in the app fills most of this in for you. Everything here is public, so leave out keys, chat text and anything else you do not want to share.
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → This install has a Copy button for the version line.
      placeholder: "v0.1.0 (f4cdde34be59, container)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker
        - From source
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots
      description: Paste server log lines, or drag in screenshots or the diagnostics file.
