# Monthly, batched updates: one npm PR (plus one for majors) and one infrastructure PR per month, each version at least two
# weeks old (majors a month) so broken releases are caught upstream first. Security fixes ignore the
# schedule and cooldown and arrive as one grouped PR.
# npm updates rely on Dependabot's pnpm 12 support; alerts for the npm tree come from the SBOM that
# dependency-graph.yml submits, because GitHub's graph cannot read the pnpm 12 lockfile.
# Version updates target main; security updates use the default release branch independently.
version: 2

multi-ecosystem-groups:
  infrastructure:
    # A grouped ecosystem may not set its own target-branch; the group carries it.
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: build

updates:
  - package-ecosystem: npm
    target-branch: main
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 2
    # Majors get their own PR: each is a migration to read on purpose, and one red major must not hold
    # back the routine minor and patch batch.
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
    # TypeScript moves by hand. The checker runs two compilers side by side (6.x as `typescript`, 7.x through
    # the `ts7` and `@typescript/native` catalog aliases), and typescript-eslint caps its peer below 6.1, so
    # anything past a 6.0 patch breaks lint while every resolver still calls it compatible.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # This release rejects required null checks on regex results and sparse dictionaries.
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.14"]
      # Its public types force DOM globals into the pure Node compiler world.
      - dependency-name: colorjs.io
        versions: ["0.7.1"]
      # The runner and CT package share a pinned Chromium revision; update them together by hand.
      - dependency-name: "@playwright/*"
      # Version-keyed patches must be ported before a dependency bump; unused patches fail installation.
      # Stryker's core, runner, checker and API are a pinned lockstep suite.
      - dependency-name: "@stryker-mutator/*"
      - dependency-name: "@ts-morph/common"
      - dependency-name: chrome-devtools-mcp
      - dependency-name: isomorphic-git
      - dependency-name: ts-morph
      - dependency-name: node-av
    commit-message:
      prefix: chore
      include: scope

  # A non-default target-branch's options do not configure default-branch security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # Dependabot rejects YAML aliases; the test requires matching npm ignore policies.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # This release rejects required null checks on regex results and sparse dictionaries.
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.14"]
      # Its public types force DOM globals into the pure Node compiler world.
      - dependency-name: colorjs.io
        versions: ["0.7.1"]
      # The runner and CT package share a pinned Chromium revision; update them together by hand.
      - dependency-name: "@playwright/*"
      # Version-keyed patches must be ported before a dependency bump; unused patches fail installation.
      # Stryker's core, runner, checker and API are a pinned lockstep suite.
      - dependency-name: "@stryker-mutator/*"
      - dependency-name: "@ts-morph/common"
      - dependency-name: chrome-devtools-mcp
      - dependency-name: isomorphic-git
      - dependency-name: ts-morph
      - dependency-name: node-av
    commit-message:
      prefix: fix
      include: scope

  # Actions, base images (pinned by digest; tag and digest move together), Compose images and the dev
  # container share the infrastructure PR.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: docker-compose
    directories: [/, /docker]
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: devcontainers
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
