# Monthly, batched updates: one npm PR and one infrastructure PR per month, each version at least two
# weeks old (majors a month) so broken releases are caught upstream first. Security fixes ignore the
# schedule and cooldown and arrive as one grouped PR.
# npm updates rely on Dependabot's pnpm 12 support; alerts for the npm tree come from the SBOM that
# dependency-graph.yml submits, because GitHub's graph cannot read the pnpm 12 lockfile.
# The default branch is `release` (what users install), so every entry targets `main` explicitly.
version: 2

multi-ecosystem-groups:
  infrastructure:
    # A grouped ecosystem may not set its own target-branch; the group carries it.
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: build

updates:
  - package-ecosystem: npm
    target-branch: main
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # Actions, base images (pinned by digest; tag and digest move together), Compose images and the dev
  # container share the infrastructure PR.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: docker-compose
    directories: [/, /docker]
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: devcontainers
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
