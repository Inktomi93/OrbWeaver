# Monthly, batched updates: one npm PR (plus one for majors) and one infrastructure PR per month, each version at least two
# weeks old (majors a month) so broken releases are caught upstream first. Security fixes ignore the
# schedule and cooldown and arrive as one grouped PR.
# npm updates rely on Dependabot's pnpm 12 support; alerts for the npm tree come from the SBOM that
# dependency-graph.yml submits, because GitHub's graph cannot read the pnpm 12 lockfile.
# The default branch is `release` (what users install), so every entry targets `main` explicitly.
version: 2

multi-ecosystem-groups:
  infrastructure:
    # A grouped ecosystem may not set its own target-branch; the group carries it.
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: build

updates:
  - package-ecosystem: npm
    target-branch: main
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 2
    # Majors get their own PR: each is a migration to read on purpose, and one red major must not hold
    # back the routine minor and patch batch.
    groups:
      # Playwright's runner and its component-testing package must sit on the same version, and the CT package
      # publishes later, so the two move together and only on patches (minors by hand, below).
      playwright:
        applies-to: version-updates
        patterns: ["@playwright/*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # TypeScript moves by hand. The checker runs two compilers side by side (6.x as `typescript`, 7.x through
    # the `ts7` and `@typescript/native` catalog aliases), and typescript-eslint caps its peer below 6.1, so
    # anything past a 6.0 patch breaks lint while every resolver still calls it compatible.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@playwright/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: chore
      include: scope

  # Actions, base images (pinned by digest; tag and digest move together), Compose images and the dev
  # container share the infrastructure PR.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: docker-compose
    directories: [/, /docker]
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    cooldown:
      default-days: 14

  - package-ecosystem: devcontainers
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
