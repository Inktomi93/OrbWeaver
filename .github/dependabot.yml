# npm updates rely on Dependabot's pnpm 12 support; alerts for the npm tree come from the SBOM that
# dependency-graph.yml submits, because GitHub's graph cannot read the pnpm 12 lockfile.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Base images are pinned by digest; Dependabot moves the tag and the digest together.
  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directories: [/, /docker]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
