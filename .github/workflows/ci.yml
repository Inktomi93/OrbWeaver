name: ci

# Auto-triggers DISABLED (2026-07-05, Alex): the real gate is local `pnpm check` at the pre-commit +
# pre-push lefthook hooks — CI-on-push just re-ran the same suite. Kept as MANUAL-only (`workflow_dispatch`)
# so it can be run on demand from the Actions tab; re-enable auto-runs by restoring the `push`/`pull_request`
# triggers below.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm reads the pinned packageManager from package.json, then pnpm install downloads the
      # devEngines.runtime-pinned Node itself — no separate Node setup step needed.
      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      # Playwright chromium — the --full tier runs the CT suite + full e2e (browser lanes).
      - run: pnpm exec playwright install --with-deps chromium

      # The ONE "nothing omitted" bar (UNIFIED-VERIFICATION-DESIGN.md §3.2, V4): the full tier — static
      # (biome + tsc×3 + the ts-morph gates + depcruise + docs) + node tests + CT + e2e-smoke + cpd + full
      # e2e + parity (loud-skips if the steady clone is absent) + the mutation gate. ONE command, ONE
      # summary, ONE max-severity exit; the per-stage logs land in reports/verify/. Replaces the old
      # check + test + cpd trio (which omitted the browser + quality lanes entirely). CI is
      # workflow_dispatch-only (2026-07-05), so the operator dispatches this when the works is wanted; the
      # per-push automated bar is the pre-push lefthook (`pnpm verify --push`).
      - run: pnpm verify --full
        env:
          CI: "true"
