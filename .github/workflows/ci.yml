name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @orb/showcase-plugins build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm lint:eslint
      - run: pnpm lint:css
      - run: pnpm depcruise
      - name: Check unused files, exports and dependencies
        run: pnpm knip
      - name: Check that production exports have production consumers
        run: pnpm knip:prod

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash scripts/ci/install-media.sh
      - run: pnpm --filter @orb/showcase-plugins build
      - run: pnpm test --maxWorkers=2 --reporter=default --reporter=json --outputFile=reports/test-report.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-results
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  ct:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: pnpm --filter @orb/showcase-plugins build
      - run: pnpm test:ct --workers=2
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: component-results
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: bash scripts/ci/install-media.sh
      - run: pnpm --filter @orb/showcase-plugins build
      - run: pnpm e2e:smoke --workers=1
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-results
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci-ok:
    name: CI
    if: always()
    needs: [static, node, ct, e2e-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every application check
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success")'
