name: ci

# Auto-triggers DISABLED (2026-07-05, Alex): the real gate is local `pnpm check` at the pre-commit +
# pre-push lefthook hooks — CI-on-push just re-ran the same suite. Kept as MANUAL-only (`workflow_dispatch`)
# so it can be run on demand from the Actions tab; re-enable auto-runs by restoring the `push`/`pull_request`
# triggers below.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm first (reads the pinned packageManager from package.json), then node with pnpm cache.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The blocking gate suite: biome + tsc + the ts-morph gates + dependency-cruiser.
      - run: pnpm check

      # The node test lanes (unit + integration + contract). CI=true → vitest uses the github-actions
      # + junit reporters (vitest.config.ts) and `allowOnly`/determinism rigor applies.
      - run: pnpm test

      # The type lane (`.test-d.ts`, typecheck-only) — nothing else runs it (per-package tsc covers src,
      # not tests/). Passes-with-no-tests until type tests land.
      - run: pnpm test:types

      # The copy-paste CI lane (jscpd, threshold 5%) — kept out of the fast pre-commit `check`.
      - run: pnpm cpd

      # Browser lanes (Playwright e2e + CT) are deferred to Phase 6 (client) — no specs/stack yet.
      # Mutation testing (Stryker) is on-demand (Phase 4c/5), never in CI's fast path.
