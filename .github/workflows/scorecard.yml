name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned actions, token permissions,
# branch protection, dependency updates) and reports each failing check as a code scanning alert.
on:
  # Scorecard grades the default branch, which is `release`.
  push:
    branches: [release]
  schedule:
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
