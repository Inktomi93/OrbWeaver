name: Release metadata run approval

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only trusted main executes; triggering code is closed metadata data, never checked out or run.
    workflows: [CI, CodeQL]
    types: [completed]

permissions: {}

concurrency:
  group: release-run-approval-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Check out only trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install trusted main with restore-only caches
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] Privileged approval executes only the trusted main checkout, never the triggering PR.
      - name: Validate the closed metadata diff and approve only this blocked run
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec node scripts/ci/approve-release-run.ts
