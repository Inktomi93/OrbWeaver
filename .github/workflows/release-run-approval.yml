name: Release metadata run approval

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]

permissions: {}

concurrency:
  group: release-run-approval-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate the closed metadata diff and approve only this blocked run
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec node scripts/ci/approve-release-run.ts
