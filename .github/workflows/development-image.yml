name: development image

# The publication branch permits the first build before manual dispatch is available on main.
on:
  push:
    branches: [codex/launch-packages]
  workflow_dispatch:

permissions: {}

concurrency:
  group: development-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/inktomi93/orbweaver
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-tags: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the development image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=development-image
          cache-to: type=gha,scope=development-image,mode=max,ignore-error=true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_VERSION=development

      - name: Prove development identity
        run: |
          stamp=$(docker run --rm --entrypoint cat "$IMAGE:sha-$SOURCE_SHA" /app/version.json)
          echo "version.json: $stamp"
          echo "$stamp" | jq -e --arg sha "$SOURCE_SHA" '.commit == $sha and .channel == "main"'
          revision=$(docker inspect "$IMAGE:sha-$SOURCE_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$SOURCE_SHA"

      - name: Prove fresh runtime boot
        run: |
          container=$(docker run -d --init --env-file docker/orbweaver.env -e BIND_HOST=0.0.0.0 -e LOCAL_LIGHT_PREFETCH=off -p 127.0.0.1:18788:8788 "$IMAGE:sha-$SOURCE_SHA")
          trap 'docker logs "$container"; docker rm -fv "$container"' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18788/healthz > "$RUNNER_TEMP/development-health.json"; then
              ready=true
              break
            fi
            test "$(docker inspect "$container" --format '{{.State.Running}}')" = true
            sleep 2
          done
          test "$ready" = true
          docker exec "$container" node -e 'const response = await fetch("http://127.0.0.1:8788/healthz"); if (!response.ok) process.exit(1); console.log(await response.text());' > "$RUNNER_TEMP/development-operator-health.json"
          jq -e --arg sha "$SOURCE_SHA" '.version.commit == $sha and .version.channel == "main"' "$RUNNER_TEMP/development-operator-health.json"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push development tags
        run: |
          docker push "$IMAGE:sha-$SOURCE_SHA"
          docker tag "$IMAGE:sha-$SOURCE_SHA" "$IMAGE:development"
          docker push "$IMAGE:development"

      - name: Prove anonymous digest pull
        run: |
          digest=$(docker inspect "$IMAGE:sha-$SOURCE_SHA" --format '{{ index .RepoDigests 0 }}' | cut -d@ -f2)
          test -n "$digest"
          proof=$(mktemp -d "$RUNNER_TEMP/anonymous-image.XXXXXX")
          if ! docker run --rm -v "$proof:/proof" quay.io/skopeo/stable:latest@sha256:966b7d73acc4478906280e4967cafd93f4a85273e9a97b41b2ea8f9bd55292a5 copy --src-no-creds --preserve-digests "docker://$IMAGE@$digest" oci:/proof/image:published; then
            echo "::error::The development image bytes do not download anonymously. Make the GHCR package public, then re-run this job."
            exit 1
          fi
          python3 - "$proof/image" "$digest" "$SOURCE_SHA" <<'PYTHON'
          import hashlib, json, pathlib, sys, tarfile
          root, digest, sha = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          def verified_blob(descriptor):
              algorithm, value = descriptor["digest"].split(":")
              assert algorithm == "sha256" and len(value) == 64 and all(c in "0123456789abcdef" for c in value)
              path = root / "blobs" / algorithm / value
              with path.open("rb") as stream:
                  assert hashlib.file_digest(stream, "sha256").hexdigest() == value
              assert path.stat().st_size == descriptor["size"]
              return path
          index = json.loads((root / "index.json").read_text())
          descriptor, = index["manifests"]
          assert descriptor["digest"] == digest
          manifest = json.loads(verified_blob(descriptor).read_text())
          config = json.loads(verified_blob(manifest["config"]).read_text())
          assert config["config"]["Labels"]["org.opencontainers.image.revision"] == sha
          stamp = None
          for layer in manifest["layers"]:
              path = verified_blob(layer)
              with tarfile.open(path) as archive:
                  for member in archive:
                      if member.name.removeprefix("./") == "app/version.json":
                          stream = archive.extractfile(member)
                          assert stream is not None
                          stamp = json.load(stream)
          assert stamp is not None and stamp["commit"] == sha and stamp["channel"] == "main"
          print(json.dumps({"digest": digest, "downloadedLayers": len(manifest["layers"]), "stamp": stamp}))
          PYTHON
          printf 'Development image: %s@%s\nSource commit: %s\nTags: development, sha-%s\n' "$IMAGE" "$digest" "$SOURCE_SHA" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
