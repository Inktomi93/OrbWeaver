name: docker-publish

# Builds the ONE production image (Dockerfile target `runtime`) and pushes it to GHCR so a new user can
# `docker compose up -d` without building. Runs on a version tag or by hand (the owner pushes tags
# manually; nothing here fires on ordinary pushes — ci.yml's workflow_dispatch-only stance, 2026-07-05).
#
#   git tag v0.1.0 && git push origin v0.1.0      → ghcr.io/inktomi93/orbweaver:0.1.0 + :latest
#
# amd64 only for now: an arm64 build runs pnpm install + vite under QEMU and the native postinstalls
# (sharp, onnxruntime-node, @napi-rs/canvas) each need their arm64 prebuilds — add `linux/arm64` to
# `platforms` once that has been built and booted on real hardware.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag to publish (default: the git sha, no `latest`)"
        required: false

permissions:
  contents: read
  packages: write
  id-token: write   # provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/inktomi93/orbweaver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
