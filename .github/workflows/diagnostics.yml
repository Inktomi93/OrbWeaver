name: Diagnostics
run-name: E2E startup diagnostics · ${{ github.ref_name }}
on:
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-startup-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: single-user
            spec: app-readiness.spec.ts
          - project: local
            spec: auth-smoke.local.spec.ts
          - project: forward-header
            spec: auth-smoke.forward.spec.ts
    env:
      E2E_LIVE: "0"
      E2E_ALLOW_DEV_TARGET: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - id: media
        name: Set up FFmpeg and FFprobe
        timeout-minutes: 15
        run: bash scripts/ci/install-media.sh
      - id: showcase
        run: pnpm --filter @orb/showcase-plugins build
      - id: startup
        name: E2E startup diagnostics (not qualification)
        env:
          E2E_PROJECT: ${{ matrix.project }}
          E2E_SPEC: ${{ matrix.spec }}
        run: pnpm e2e "$E2E_SPEC" --project="$E2E_PROJECT" --retries=0
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-e2e-startup-diagnostic-${{ matrix.project }}
          path: |
            reports/
            test-results/
          retention-days: 7
