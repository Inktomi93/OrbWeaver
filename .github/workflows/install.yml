name: Install proof
run-name: Install proof · ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

# Source jobs prove the README install, launch, stop and native broker paths on fresh runners.
# Docker uses the published release tag so compose and broker proofs match the immutable image.
# pnpm downloads package.json's pinned Node; a green exact-main marker skips unchanged nightly proof.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 10 * * *"
permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: false

env:
  HEALTHZ: http://127.0.0.1:8788/healthz
jobs:
  head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          persist-credentials: false
      - id: sha
        name: Freeze the selected source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: release
        name: Resolve the published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          tag=$(echo "$metadata" | jq -er 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error title=Published release::Invalid stable tag=$tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  source:
    needs: [head]
    name: source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.head.outputs.sha }}
          fetch-depth: 0
      - id: seen
        name: Look up the completed native proof
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-proof
          key: install-source-v1-${{ matrix.os }}-${{ needs.head.outputs.sha }}
          lookup-only: true
      - name: Install pnpm (README, Linux and macOS)
        if: steps.seen.outputs.cache-hit != 'true' && (runner.os != 'Windows')
        run: |
          # The script refuses to guess the shell when SHELL is unset, which a terminal always sets.
          export SHELL="${SHELL:-/bin/bash}"
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          # A terminal picks these up from the shell profile the script edits; a runner step does not.
          if [ "$RUNNER_OS" = macOS ]; then pnpm_home="$HOME/Library/pnpm"; else pnpm_home="${XDG_DATA_HOME:-$HOME/.local/share}/pnpm"; fi
          echo "PNPM_HOME=$pnpm_home" >> "$GITHUB_ENV"
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
      - name: Install pnpm (README, Windows PowerShell)
        if: steps.seen.outputs.cache-hit != 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          Invoke-WebRequest https://get.pnpm.io/install.ps1 -UseBasicParsing | Invoke-Expression
          # A new console picks these up from the user environment the script sets; a runner step does not.
          $pnpmHome = Join-Path $env:LOCALAPPDATA "pnpm"
          "PNPM_HOME=$pnpmHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Join-Path $pnpmHome "bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: pnpm install
        id: install
        shell: bash
        run: |
          set -o pipefail
          pnpm install 2>&1 | tee "$RUNNER_TEMP/install.log"
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Report README install failure
        if: failure() && steps.install.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=README install (${{ matrix.os }})::pnpm install failed"
          { echo '### pnpm install'; echo '```text'; tail -n 80 "$RUNNER_TEMP/install.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Report the Node versions
        shell: bash
        run: |
          node --version || echo "no node on PATH"
          pnpm exec node -e "console.log('pnpm scripts run node', process.version, 'from', process.execPath)"
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Start, wait for /healthz, stop (Linux and macOS)
        if: steps.seen.outputs.cache-hit != 'true' && (runner.os != 'Windows')
        run: |
          pnpm start < /dev/null > "$RUNNER_TEMP/start.log" 2>&1 &
          start_pid=$!
          # The server logs to this same output (pnpm start runs it in the foreground), so start.log is the whole story.
          show_log() { echo "--- start.log"; cat "$RUNNER_TEMP/start.log"; }
          # Measured cold: 31 s to 50 s from here to /healthz on these runners, the client build 25 s to 38 s of it.
          for _ in $(seq 1 120); do
            if curl -fsS "$HEALTHZ" > /dev/null 2>&1; then break; fi
            if ! kill -0 "$start_pid" 2> /dev/null; then echo "pnpm start exited before /healthz answered"; show_log; exit 1; fi
            sleep 5
          done
          if ! curl -fsS "$HEALTHZ"; then echo "the server never answered /healthz"; show_log; exit 1; fi
          echo
          # Newest match: pnpm may run the script through `sh -c`, whose command line matches too.
          supervisor=$(pgrep -n -f "tooling/src/stack/cli.ts start")
          # The Ctrl-C a person sends: the supervisor forwards it to the server and exits with it.
          kill -INT "$supervisor"
          for _ in $(seq 1 60); do
            if ! kill -0 "$supervisor" 2> /dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$supervisor" 2> /dev/null; then echo "pnpm start is still running after Ctrl-C"; exit 1; fi
          if curl -fsS "$HEALTHZ" > /dev/null 2>&1; then echo "the server still answers after the stop"; exit 1; fi
      - name: Start with start.cmd, wait for /healthz, stop (Windows)
        if: steps.seen.outputs.cache-hit != 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          $noInput = Join-Path $env:RUNNER_TEMP "no-input.txt"
          New-Item -ItemType File -Path $noInput -Force | Out-Null
          $start = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "start.cmd" -NoNewWindow -PassThru `
            -RedirectStandardInput $noInput `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "start.log") `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP "start.err.log")
          # The server logs to this same output (start.cmd runs pnpm start in the foreground), so these two are the whole story.
          function Show-StartLog {
            foreach ($name in "start.log", "start.err.log") {
              Write-Host "--- $name"
              Get-Content (Join-Path $env:RUNNER_TEMP $name) -ErrorAction Continue
            }
          }
          # Measured cold on the POSIX runners: 31 s to 50 s to /healthz, the client build 25 s to 38 s of it.
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $up; $i++) {
            if ($start.HasExited) {
              Show-StartLog
              throw "start.cmd exited with code $($start.ExitCode) before /healthz answered"
            }
            try {
              $up = (Invoke-WebRequest $env:HEALTHZ -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $up) {
            Show-StartLog
            throw "the server never answered /healthz"
          }
          # No console Ctrl-C can reach a process started from a runner step, so the stop is a tree kill.
          taskkill /PID $start.Id /T /F
          Start-Sleep -Seconds 3
          $stillUp = $true
          try { Invoke-WebRequest $env:HEALTHZ -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { $stillUp = $false }
          if ($stillUp) { throw "the server still answers after the stop" }
      - name: Show the start log
        if: steps.seen.outputs.cache-hit != 'true' && (always())
        shell: bash
        run: cat "$RUNNER_TEMP"/start*.log || true
      - name: Prove plugin broker containment and residency
        shell: bash
        env:
          PLUGIN_BROKER_PROOF_RECEIPT: ${{ runner.temp }}/plugin-broker-proof-1.json
        run: pnpm test:scoped tests/server/infra/plugin-host/platform-proof.suite.test.ts
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Prove plugin broker supervision
        if: steps.seen.outputs.cache-hit != 'true' && (!cancelled())
        run: pnpm test:scoped tests/server/infra/plugin-host/broker-supervision.suite.test.ts
      - name: Add plugin broker receipt to the run summary
        if: steps.seen.outputs.cache-hit != 'true' && (!cancelled())
        shell: bash
        run: |
          pnpm exec node --input-type=module - <<'NODE'
          import { appendFile, readFile, readdir } from "node:fs/promises";
          import { resolve } from "node:path";
          for (const name of (await readdir(process.env.RUNNER_TEMP)).filter((name) => /^plugin-broker-proof-\d+\.json$/u.test(name)).sort()) {
            const text = await readFile(resolve(process.env.RUNNER_TEMP, name), "utf8");
            await appendFile(process.env.GITHUB_STEP_SUMMARY, `### Plugin broker proof (${process.env.RUNNER_OS}, ${name})\n\`\`\`json\n${text}\`\`\`\n`);
          }
          NODE
      - name: Upload plugin broker receipt
        if: steps.seen.outputs.cache-hit != 'true' && (!cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-broker-proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/plugin-broker-proof-*.json
            ${{ runner.temp }}/start*.log
            reports/
          if-no-files-found: warn
          retention-days: 14
      - id: mark
        name: Mark the completed native proof
        if: success() && github.event_name == 'schedule' && steps.seen.outputs.cache-hit != 'true'
        env:
          PROOF_SHA: ${{ needs.head.outputs.sha }}
        run: echo "$PROOF_SHA" > .native-proof
      - if: success() && steps.mark.outcome == 'success'
        name: Save the completed native proof marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-proof
          key: install-source-v1-${{ matrix.os }}-${{ needs.head.outputs.sha }}
  docker:
    needs: [head]
    name: docker (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.head.outputs.release_tag }}
      - id: seen
        name: Look up the completed native proof
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-proof
          key: install-docker-v1-${{ needs.head.outputs.sha }}-${{ needs.head.outputs.release_tag }}
          lookup-only: true
      - id: image
        name: Prove the immutable published image identity
        env:
          RELEASE_TAG: ${{ needs.head.outputs.release_tag }}
        run: |
          image="ghcr.io/inktomi93/orbweaver:${RELEASE_TAG#v}"
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          docker pull "$image"
          sha=$(git rev-parse HEAD)
          stamp=$(docker run --rm --entrypoint cat "$image" /app/version.json)
          echo "$stamp" | jq -e --arg sha "$sha" --arg version "${RELEASE_TAG#v}" '.commit == $sha and .channel == "stable" and .version == $version' || { echo "::error title=Install image identity::Stamp mismatch expected sha=$sha version=${RELEASE_TAG#v} channel=stable; actual=$(echo "$stamp" | jq -c .)"; exit 1; }
          revision=$(docker inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$sha" || { echo "::error title=Install image identity::Expected revision=$sha; got $revision"; exit 1; }
          digest=$(docker inspect "$image" --format '{{ index .RepoDigests 0 }}' | cut -d@ -f2)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error title=Install image identity::Invalid digest=$digest"; exit 1; }
          echo "ORB_IMAGE=$image@$digest" >> "$GITHUB_ENV"
        if: steps.seen.outputs.cache-hit != 'true'
      - name: docker compose pull
        id: pull
        run: |
          set -o pipefail
          docker compose pull 2>&1 | tee "$RUNNER_TEMP/compose-pull.log"
        if: steps.seen.outputs.cache-hit != 'true'
      - name: docker compose up -d
        id: up
        run: |
          set -o pipefail
          docker compose up -d 2>&1 | tee "$RUNNER_TEMP/compose-up.log"
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Report README Docker install failure
        if: failure() && (steps.pull.outcome == 'failure' || steps.up.outcome == 'failure')
        run: |
          echo "::error title=README install (Docker)::docker compose pull or up failed"
          for log in "$RUNNER_TEMP"/compose-*.log; do
            if [[ -f "$log" ]]; then
              { echo "### ${log##*/}"; echo '```text'; tail -n 80 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$HEALTHZ" > /dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS "$HEALTHZ" || { echo "::error title=README Docker readiness::No successful health response at $HEALTHZ after startup polling"; exit 1; }
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Prove the plugin broker cannot read the data dir in the production image
        run: |
          for file in _broker-containment-proof.ts _broker-permission-probe.ts _worker-drop-preload.ts; do
            docker compose exec --user node -T orbweaver sh -c "cat > /app/.cache/$file" < "tests/server/infra/plugin-host/$file"
          done
          docker compose exec --user node -T orbweaver node /app/.cache/_broker-containment-proof.ts --root=/app
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Prove plugin broker containment and residency in the production image
        run: |
          docker compose stop orbweaver
          mkdir -p "$RUNNER_TEMP/docker-proof"
          chmod 0777 "$RUNNER_TEMP/docker-proof"
          docker compose run --rm --no-deps -T --user node --entrypoint node \
            -v "$PWD/tests/server/infra/plugin-host/_platform-proof.ts:/app/.cache/plugin-platform-proof.ts:ro" \
            -v "$RUNNER_TEMP/docker-proof:/proof" \
            orbweaver /app/.cache/plugin-platform-proof.ts --run-proof --root=/app --json=/proof/plugin-broker-proof.json
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Copy Docker plugin broker receipt
        if: steps.seen.outputs.cache-hit != 'true' && (always())
        run: cp "$RUNNER_TEMP/docker-proof/plugin-broker-proof.json" "$RUNNER_TEMP/plugin-broker-proof-docker.json" || true
      - name: Add Docker plugin broker receipt to the run summary
        if: steps.seen.outputs.cache-hit != 'true' && (!cancelled())
        run: |
          receipt="$RUNNER_TEMP/plugin-broker-proof-docker.json"
          if [ -f "$receipt" ]; then
            {
              echo "### Plugin broker proof (Docker)"
              echo '```json'
              cat "$receipt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Docker plugin broker receipt
        if: steps.seen.outputs.cache-hit != 'true' && (!cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-broker-proof-docker
          path: ${{ runner.temp }}/plugin-broker-proof-docker.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show the container log
        if: steps.seen.outputs.cache-hit != 'true' && (always())
        run: docker compose logs orbweaver
      - name: Stop
        if: steps.seen.outputs.cache-hit != 'true' && (always())
        run: |
          docker compose down
          if curl -fsS "$HEALTHZ" > /dev/null 2>&1; then echo "the app still answers after docker compose down"; exit 1; fi
      - id: mark
        name: Mark the completed native proof
        if: success() && github.event_name == 'schedule' && steps.seen.outputs.cache-hit != 'true'
        env:
          PROOF_SHA: ${{ needs.head.outputs.sha }}
        run: echo "$PROOF_SHA" > .native-proof
      - if: success() && steps.mark.outcome == 'success'
        name: Save the completed native proof marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-proof
          key: install-docker-v1-${{ needs.head.outputs.sha }}-${{ needs.head.outputs.release_tag }}
