name: Select CPU diagnostic only
run-name: Select native control and CPU diagnostic on ${{ github.ref_name }}

# Profiled timings are diagnostic evidence, never CI qualification or a Select budget exemption.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: select-cpu-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: $/.github/actions/setup
        with:
          browsers: "true"
      - id: showcase
        run: pnpm --filter @orb/showcase-plugins build
      - id: native-control
        name: Native Select acceptance without CPU profiling
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.showcase.outcome == 'success' }}
        run: pnpm test:ct tests/client/lib/motion-stats.ct.tsx --grep='a real sealed Select classifies its confirmed first and repeat entrance lifetimes only$' --retries=0
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: select-native-control
          path: reports/
          retention-days: 7
      - id: cpu-diagnostic
        name: Diagnostic-only Select CPU captures (not qualification)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.showcase.outcome == 'success' }}
        env:
          ORB_SELECT_CPU_DIAGNOSTIC: "1"
        run: pnpm test:ct tests/client/lib/motion-stats.ct.tsx --grep='Select CPU diagnostic only' --retries=0
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: select-cpu-diagnostic-only
          path: reports/
          retention-days: 7
