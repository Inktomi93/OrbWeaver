name: Release
run-name: Release · ${{ github.event.head_commit.message }}

# Stable releases. `main` is integration; `release` is stable and the default branch. `pnpm release` pushes
# main here, and release-please keeps one release PR open (conventional commits: feat bumps the minor and fix
# the patch below 1.0, release-please-config.json). Merging it tags `v<version>`, publishes the GitHub
# Release, and this run builds the runtime image from the tag, attests its provenance, pushes it to GHCR as
# `<version>` and `latest`, and finishes the release notes. The plugin-authoring component releases the
# same way with its own tag. linux/amd64 only until the native dependencies are proven on arm64.
on:
  push:
    branches: [release]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      # The plugin authoring component (packages/plugin-sdk + packages/plugin-toolchain) releases on its own.
      plugin_authoring_created: ${{ steps.release.outputs['packages--release_created'] }}
      plugin_authoring_tag: ${{ steps.release.outputs['packages--tag_name'] }}
      plugin_authoring_version: ${{ steps.release.outputs['packages--version'] }}
    steps:
      # The GITHUB_TOKEN default is enough: every job that acts on a release runs in this same workflow, so
      # nothing needs a run triggered by the tag or the release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: release

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      # The name docker-compose.yaml pulls by default. GHCR names are lowercase.
      IMAGE: ghcr.io/inktomi93/orbweaver
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # The tag itself, so the build context carries `.git/refs/tags/v<version>` and the image's version
      # stamp derives the `stable` channel from it (docker/assemble-runtime.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A path context, not the action's default git context: only the checkout carries the ref files the
      # version stamp reads.
      # The layer cache lives in the GitHub Actions cache between releases (docs.docker.com/build/cache/backends/gha),
      # so a release whose lockfile did not change reuses the store fetch, the bulk of the dependency download. The
      # stages after it re-run, because every release changes package.json's version and the source. `max` exports
      # the intermediate stages too, which is where the fetch layer is. The cache mounts are not carried (the
      # Dockerfile's `deps` stage says why that is safe). A failed cache export must not cost the release, so it
      # is ignored; the next release just builds colder.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ needs.release-please.outputs.sha }}
            IMAGE_VERSION=${{ env.VERSION }}

      # Refuse to publish an image that would report itself as a development build or another version.
      - name: Prove the image is this stable release
        run: |
          stamp=$(docker run --rm --entrypoint cat "$IMAGE:$VERSION" /app/version.json)
          echo "version.json: $stamp"
          echo "$stamp" | jq -e --arg version "$VERSION" '.version == $version and .channel == "stable"'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both tags
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Read the pushed digest
        id: digest
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # SLSA build provenance, stored beside the image in GHCR: anyone can check that this exact digest was
      # built by this workflow from this tag (`gh attestation verify`, printed in the release notes).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # GHCR publishes a new package as private, and docker-compose.yaml pulls with no login. Pull through an
      # empty Docker config so a private package fails the release here instead of every user's first pull.
      - name: Prove the image pulls without credentials
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          if ! docker pull "$IMAGE:$VERSION"; then
            echo "::error::$IMAGE:$VERSION does not pull without credentials, so the GHCR package is private. Set it Public (package settings, Danger Zone, Change visibility), then re-run this job."
            exit 1
          fi

  # release-please writes what changed; this adds what to do about it. Immutable releases lock the tag and
  # the assets, not the notes, so the notes can be finished after publication.
  notes:
    needs: [release-please, image]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Add the upgrade steps to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          cat >> notes.md <<NOTES

          ## Upgrade

          Back up \`data/\` first: migrations only go forward, and the app copies the database to \`data/backups/\` before it applies them.

          **Docker**, in your checkout:

          \`\`\`bash
          git pull && docker compose pull && docker compose up -d
          \`\`\`

          **From source**, on the \`release\` branch: stop the app, then

          \`\`\`bash
          git pull && pnpm install && pnpm start
          \`\`\`

          ## Image

          \`ghcr.io/inktomi93/orbweaver:$VERSION\` (also \`latest\`), digest \`$DIGEST\`. Check that it was built here, from this tag:

          \`\`\`bash
          gh attestation verify oci://ghcr.io/inktomi93/orbweaver:$VERSION --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  # release-please creates the plugin-authoring release as a draft because immutable releases refuse assets
  # once a release is published. This job attaches the SDK and toolchain tarballs, adds the install lines to
  # the notes, then publishes it as a pre-release, which keeps it out of "latest" (the app's update check
  # reads that). The template repositories pick the new tag up on their own schedule.
  plugin-authoring:
    needs: release-please
    if: needs.release-please.outputs.plugin_authoring_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.plugin_authoring_tag }}
      VERSION: ${{ needs.release-please.outputs.plugin_authoring_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.plugin_authoring_tag }}
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Build the SDK and toolchain tarballs
        run: pnpm plugin:author-release dist/plugin-authoring
      - name: Attach the tarballs and publish the release
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`bash
          pnpm add -D \\
            $base/orb-plugin-sdk-$VERSION.tgz \\
            $base/orb-plugin-toolchain-$VERSION.tgz
          \`\`\`

          The [server](https://github.com/Inktomi93/OrbWeaver-plugin-template) and [visual](https://github.com/Inktomi93/OrbWeaver-plugin-template-scripted-ui) plugin starters move to this release on their own within a day.
          NOTES
          gh release upload "$TAG" dist/plugin-authoring/*.tgz --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file notes.md --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
