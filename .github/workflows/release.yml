name: Release
run-name: Release · ${{ github.event.head_commit.message }}

# Stable releases. `main` is integration; `release` is stable and the default branch. `pnpm release` pushes
# main here, and release-please keeps one release PR open (conventional commits: feat bumps the minor and fix
# the patch below 1.0, release-please-config.json). Merging it tags `v<version>` and creates a draft.
# This run builds and scans the tag's runtime image, attests it and proves anonymous pulling before
# advertising `latest` and publishing the GitHub Release. The plugin-authoring component releases the
# same way with its own tag. linux/amd64 only until the native dependencies are proven on arm64.
on:
  push:
    branches: [release]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      # The plugin authoring component (packages/plugin-sdk + packages/plugin-toolchain) releases on its own.
      plugin_authoring_created: ${{ steps.release.outputs['packages--release_created'] }}
      plugin_authoring_tag: ${{ steps.release.outputs['packages--tag_name'] }}
      plugin_authoring_version: ${{ steps.release.outputs['packages--version'] }}
    steps:
      # The GITHUB_TOKEN default is enough: every job that acts on a release runs in this same workflow, so
      # nothing needs a run triggered by the tag or the release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: release
      - name: Refuse a rerun that lost the original release outputs
        if: github.run_attempt > 1 && steps.release.outputs.release_created != 'true'
        run: |
          echo "::error title=Release::Attempt ${{ github.run_attempt }} created no release. Use 'Re-run failed jobs' so release-please's attempt-1 outputs are kept."
          exit 1

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      # The name docker-compose.yaml pulls by default. GHCR names are lowercase.
      IMAGE: ghcr.io/inktomi93/orbweaver
      BUILD_CACHE: ghcr.io/inktomi93/orbweaver:buildcache-release
      VERSION: ${{ needs.release-please.outputs.version }}
      SOURCE_SHA: ${{ needs.release-please.outputs.sha }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # The tag itself, so the build context carries `.git/refs/tags/v<version>` and the image's version
      # stamp derives the `stable` channel from it (docker/assemble-runtime.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # $/ resolves the workflow commit, so the tag checkout must identify the same source before setup.
      - name: Require the tag and workflow source to agree
        run: |
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$GITHUB_SHA" || { echo "::error title=Release source::Tag checkout=$checkout_sha differs from workflow source=$GITHUB_SHA"; exit 1; }
      - uses: $/.github/actions/setup

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: builder

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A path context, not the action's default git context: only the checkout carries the ref files the
      # version stamp reads.
      # Registry cache avoids the shared Actions-cache quota. This first pass only imports: no layers
      # are published until identity and the critical vulnerability gate pass below.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: &release-builder ${{ steps.builder.outputs.name }}
          context: &release-context .
          target: &release-target runtime
          platforms: &release-platforms linux/amd64
          load: true
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: &release-build-args |
            GIT_SHA=${{ needs.release-please.outputs.sha }}
            IMAGE_VERSION=${{ env.VERSION }}

      # The stamp and OCI revision must both identify the release source, not merely a matching version.
      - name: Prove the image is this stable release
        run: |
          stamp=$(docker run --rm --entrypoint cat "$IMAGE:$VERSION" /app/version.json)
          echo "version.json: $stamp"
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$VERSION")
          if ! echo "$stamp" | jq -e --arg version "$VERSION" --arg sha "$SOURCE_SHA" '.version == $version and .channel == "stable" and .commit == $sha' || [[ "$revision" != "$SOURCE_SHA" ]]; then
            stamp=${stamp//%/%25}; stamp=${stamp//$'\r'/%0D}; stamp=${stamp//$'\n'/%0A}
            echo "::error title=Image identity::stamp=$stamp expected version=$VERSION sha=$SOURCE_SHA channel=stable revision=$revision"
            exit 1
          fi

      # A critical CVE with a fix available in the image's own packages stops the release before anything is
      # pushed; the weekly Security scans job watches the published image for the rest.
      - name: Refuse critical fixable vulnerabilities
        id: critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-critical.txt
      - name: Summarize blocking vulnerabilities
        if: failure() && steps.critical.outcome == 'failure'
        run: |
          { echo '### Blocking vulnerabilities'; echo '```text'; cat trivy-critical.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Reuse this builder's verified result, without exporting a runtime image. max retains the
      # intermediate fetch/install stages; cache mounts remain local. A failed export only costs warmth.
      - name: Export the verified build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: *release-builder
          context: *release-context
          target: *release-target
          platforms: *release-platforms
          build-args: *release-build-args
          outputs: type=cacheonly
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }},mode=max,ignore-error=true

      - name: Push the versioned image
        run: |
          docker push "$IMAGE:$VERSION"

      - name: Read the pushed digest
        id: digest
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # SLSA build provenance, stored beside the image in GHCR: anyone can check that this exact digest was
      # built by this workflow from this tag (`gh attestation verify`, printed in the release notes).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # What is inside the image, attached to it the same way: `gh attestation verify --predicate-type
      # https://spdx.dev/Document` reads it back.
      - name: Write the image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output: sbom.spdx.json
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # GHCR publishes a new package as private, and docker-compose.yaml pulls with no login. Pull through an
      # empty Docker config so a private package fails the release here instead of every user's first pull.
      - name: Prove the image pulls without credentials
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          export IMAGE_CHANNEL=stable
          bash scripts/ci/anonymous-image-pull.sh
          {
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            echo "Verify provenance: \`gh attestation verify oci://$IMAGE:$VERSION -R $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Advertise the verified image as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec node scripts/ci/release-promotion.ts
          docker push "$IMAGE:latest"

  # Failed image jobs leave a recoverable draft. Re-running failed jobs retains the release outputs;
  # the managed notes replace their own block so a failed final publication can be retried safely.
  notes:
    if: needs.image.result == 'success'
    needs: [release-please, image]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
      SOURCE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # $/ resolves the workflow commit, so the tag checkout must identify the same source before setup.
      - name: Require the tag and workflow source to agree
        run: |
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$GITHUB_SHA" || { echo "::error title=Release source::Tag checkout=$checkout_sha differs from workflow source=$GITHUB_SHA"; exit 1; }
      - uses: $/.github/actions/setup
      - name: Add the upgrade steps to the release notes
        run: |
          pnpm exec node scripts/ci/release-promotion.ts
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > raw-notes.md
          sed '/^<!-- orbweaver-publication -->$/,$d' raw-notes.md > notes.md
          cat >> notes.md <<NOTES

          <!-- orbweaver-publication -->
          ## Upgrade

          Back up \`data/\` first: migrations only go forward, and the app copies the database to \`data/backups/\` before it applies them.

          **Docker**, in your checkout:

          \`\`\`bash
          git pull && docker compose pull && docker compose up -d
          \`\`\`

          **From source**, on the \`release\` branch: stop the app, then

          \`\`\`bash
          git pull && pnpm install && pnpm start
          \`\`\`

          ## Image

          \`ghcr.io/inktomi93/orbweaver:$VERSION\` (also \`latest\`), digest \`$DIGEST\`. Check that it was built here, from this tag:

          \`\`\`bash
          gh attestation verify oci://ghcr.io/inktomi93/orbweaver:$VERSION --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest

  # release-please creates the plugin-authoring release as a draft because immutable releases refuse assets
  # once a release is published. This job attaches the SDK and toolchain tarballs, adds the install lines to
  # the notes, then publishes it as a pre-release, which keeps it out of "latest" (the app's update check
  # reads that). The template repositories pick the new tag up on their own schedule.
  plugin-authoring:
    needs: release-please
    if: needs.release-please.outputs.plugin_authoring_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.plugin_authoring_tag }}
      VERSION: ${{ needs.release-please.outputs.plugin_authoring_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.plugin_authoring_tag }}
          persist-credentials: false
      # $/ resolves the workflow commit, so the tag checkout must identify the same source before setup.
      - name: Require the tag and workflow source to agree
        run: |
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$GITHUB_SHA" || { echo "::error title=Release source::Tag checkout=$checkout_sha differs from workflow source=$GITHUB_SHA"; exit 1; }
      - uses: $/.github/actions/setup
      - name: Build the SDK and toolchain tarballs
        run: pnpm plugin:author-release dist/plugin-authoring
      - name: Attest the plugin-authoring tarballs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/plugin-authoring/*.tgz
      - name: Attach the tarballs and publish the release
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`bash
          pnpm add -D \\
            $base/orb-plugin-sdk-$VERSION.tgz \\
            $base/orb-plugin-toolchain-$VERSION.tgz
          \`\`\`

          Verify either downloaded tarball against its build provenance:

          \`\`\`bash
          gh attestation verify orb-plugin-sdk-$VERSION.tgz -R $GITHUB_REPOSITORY
          gh attestation verify orb-plugin-toolchain-$VERSION.tgz -R $GITHUB_REPOSITORY
          \`\`\`

          The [server](https://github.com/Inktomi93/OrbWeaver-plugin-template) and [visual](https://github.com/Inktomi93/OrbWeaver-plugin-template-scripted-ui) plugin starters move to this release on their own within a day.
          NOTES
          gh release upload "$TAG" dist/plugin-authoring/*.tgz --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file notes.md --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
