name: Dependency graph

# GitHub's static parse of a pnpm 12 lockfile now reads the dependency document, but reporters on
# dependabot/dependabot-core#15904 find its runtime and development scope wrong in both directions, and scope
# decides how an alert reads. A submitted graph outranks the static parse, so this job submits the full tree from
# pnpm's own SBOM, which drives Dependabot alerts. Remove it once the static parse labels scope as `pnpm sbom --prod` does.
on:
  push:
    branches: [main, release]
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml, "**/package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Generate the complete lockfile SBOM
        run: pnpm sbom --lockfile-only --sbom-format spdx --out pnpm.spdx.json
      - name: Submit the lockfile dependency graph
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePattern: pnpm.spdx.json
          manifestPath: pnpm-lock.yaml
