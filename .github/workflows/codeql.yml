name: CodeQL

# Advanced setup instead of GitHub's default setup so code that never ships stays out of the results: the test
# suites deliberately build hostile URLs, payloads and fake servers, which CodeQL reports as real findings.
on:
  push:
    branches: [main, release]
    paths-ignore: ["docs/**", "**/*.md", ".github/**"]
  pull_request:
    branches: [main, release]
    paths-ignore: ["docs/**", "**/*.md", ".github/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - tests/**
              # One-off research scripts and a vendored copy of Chrome DevTools: neither ships.
              - scripts/probes/**
              - tooling/src/snap/lib/devtools-frontend/**
              - "**/*.test.ts"
              - "**/*.test.tsx"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
