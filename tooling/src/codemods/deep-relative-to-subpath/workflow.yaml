# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
nodes:
  - id: deep-relative-to-subpath
    name: Rewrite deep relative specifiers to #src
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["packages/*/src/**/*.ts"]
          exclude: ["**/node_modules/**"]
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["packages/*/src/**/*.tsx"]
          exclude: ["**/node_modules/**"]
