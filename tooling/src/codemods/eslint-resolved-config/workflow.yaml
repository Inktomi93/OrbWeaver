# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
nodes:
  - id: eslint-resolved-config
    name: Route calculateConfigForFile reads through resolvedConfig
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/*.d.ts", "**/codemods/*/tests*/**"]
