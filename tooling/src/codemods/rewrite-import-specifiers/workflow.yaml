# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    map:
      name: "Map file"
      description: "Path, relative to the target directory, of the JSON object mapping old specifiers to new ones"
      type: string
      default: "codemod-import-map.json"
nodes:
  - id: rewrite-import-specifiers
    name: Rewrite module specifiers by map
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
