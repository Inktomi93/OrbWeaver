# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
nodes:
  - id: text-prose-cap-pair
    name: Text prose pairs with the prose cap
    type: automatic
    steps:
      # The Plugins pane's own paragraphs. The guest-surface renderers draw plugin-authored nodes at the plugin's contract, and the other unpaired sites live in surfaces whose measure each owner judges.
      - name: Plugin management components
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/features/plugin/components/**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**", "**/plugin-surface-renderer.tsx", "**/plugin-scripted-surface.tsx", "**/plugin-leaf-nodes.tsx"]
