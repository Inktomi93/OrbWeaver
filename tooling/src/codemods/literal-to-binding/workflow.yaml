# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    plan:
      name: "Plan file"
      description: "Path, relative to the target directory, of the JSON { rewrites: [{ literal, expression, binding, from, files }] } plan"
      type: string
      default: "codemod-literal-bindings.json"
nodes:
  - id: literal-to-binding
    name: Rewrite string literals to a production binding by plan
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
