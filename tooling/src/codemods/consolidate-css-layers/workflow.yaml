version: "1"
nodes:
  - id: consolidate-css-layers
    name: Consolidate named layers
    type: automatic
    steps:
      - name: Authored stylesheets
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "css"
          include: ["**/*.css"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**", "**/*.gen.css", "**/theme.css"]
