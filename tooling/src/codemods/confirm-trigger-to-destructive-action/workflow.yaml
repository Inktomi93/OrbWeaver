# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
nodes:
  - id: confirm-trigger-to-destructive-action
    name: Confirm trigger to DestructiveAction
    type: automatic
    steps:
      - name: Client components and features
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/components/**/*.tsx", "**/features/**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**", "**/components/confirm-dialog.tsx"]
