# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    binders:
      name: "Binders"
      description: "Comma-separated parameter names that carry the root's logger, nearest enclosing function first, then this order"
      type: string
      default: "ctx,deps"
    field:
      name: "Field"
      description: "The logger's property on a binder"
      type: string
      default: "logger"
nodes:
  - id: pass-root-logger
    name: Pass the root's logger to each logging site
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
