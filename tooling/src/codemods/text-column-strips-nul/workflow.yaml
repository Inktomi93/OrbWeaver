# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
nodes:
  - id: text-column-strips-nul
    name: Move plain drizzle text columns onto nulFreeText
    type: automatic
    steps:
      - name: Schema files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["packages/db/src/schema/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
