# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    sites:
      name: "Sites file"
      description: "Path, relative to the target directory, of the JSON array of 'path:line:column' sites orb/prefer-to-sorted listed"
      type: string
      default: "codemod-to-sorted-sites.json"
nodes:
  - id: copy-sort-to-sorted
    name: Rewrite a copy-then-sort of an array to toSorted
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
