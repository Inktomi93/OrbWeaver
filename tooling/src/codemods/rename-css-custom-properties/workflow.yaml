# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    map:
      name: "Map file"
      description: "Path, relative to the target directory, of the JSON object with a `properties` map of old name to { name, unit? }"
      type: string
      default: "codemod-css-property-map.json"
nodes:
  - id: rename-css-custom-properties
    name: Rename custom-property reads by map
    type: automatic
    steps:
      - name: CSS files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "css"
          include: ["**/*.css"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**", "**/*.gen.css", "packages/ui/src/styles/theme.css"]
