# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    plan:
      name: "Plan file"
      description: "Path, relative to the target directory, of the JSON { verbs: [{ verb, field, resultType, verbFile, serviceFile, routerFile }] } plan"
      type: string
      default: "codemod-single-field-result.json"
nodes:
  - id: single-field-result-to-void
    name: Turn single-field result verbs into void verbs
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
