# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    map:
      name: "Map file"
      description: "Path, relative to the target directory, of the JSON object with the `components` list of seal names"
      type: string
      default: "codemod-drop-classname-map.json"
nodes:
  - id: drop-unsupplied-classname
    name: Drop className from the named seals
    type: automatic
    steps:
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
