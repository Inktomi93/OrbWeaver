# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    file:
      name: "Declaring file"
      description: "Path, relative to the target directory, of the file that declares the identifier"
      type: string
    from:
      name: "Current name"
      type: string
    to:
      name: "New name"
      type: string
nodes:
  - id: rename-identifier
    name: Rename the identifier and its references
    type: automatic
    steps:
      - name: TypeScript files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include: ["**/*.ts"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
          semantic_workspace: "."
      - name: TSX files
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include: ["**/*.tsx"]
          exclude: ["**/node_modules/**", "**/codemods/*/tests*/**"]
          semantic_workspace: "."
