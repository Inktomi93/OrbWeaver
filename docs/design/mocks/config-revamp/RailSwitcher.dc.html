<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    :root, .t-dark { --bg: oklch(0.158 0.006 60); --fg: oklch(0.955 0.004 75); --card: oklch(0.205 0.006 60); --raised: oklch(0.185 0.006 60); --sidebar: oklch(0.132 0.006 60); --muted: oklch(0.255 0.006 60); --muted-fg: oklch(0.74 0.008 65); --primary: oklch(0.72 0.175 52); --primary-fg: oklch(0.19 0.03 50); --border: oklch(0.99 0.005 60 / 0.08); --input: oklch(0.99 0.005 60 / 0.12); --tint: oklch(0.72 0.175 52 / 0.16); --success: oklch(0.72 0.13 155); --warning: oklch(0.79 0.13 75); }
    .t-light { --bg: oklch(0.98 0.004 75); --fg: oklch(0.24 0.01 60); --card: oklch(0.995 0.003 75); --raised: oklch(0.965 0.005 75); --sidebar: oklch(0.955 0.006 72); --muted: oklch(0.95 0.006 70); --muted-fg: oklch(0.44 0.01 65); --primary: oklch(0.55 0.16 50); --primary-fg: oklch(0.99 0.01 75); --border: oklch(0.2 0.01 60 / 0.12); --input: oklch(0.2 0.01 60 / 0.16); --tint: oklch(0.55 0.16 50 / 0.14); --success: oklch(0.47 0.12 155); --warning: oklch(0.50 0.11 75); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary); } a:hover { color: var(--fg); }
    .root { font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: var(--fg); background: var(--bg); overflow: hidden; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace; }
    .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); }
    .shell { display: grid; grid-template-columns: 56px 320px minmax(0, 1fr) 384px; height: 100%; }
    .rail { background: var(--sidebar); border-right: 1.25px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; position: relative; }
    .rail .g { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: var(--muted-fg); }
    .rail .g svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .rail .g.on { background: var(--tint); color: var(--fg); }
    .rail .end { margin-top: auto; }
    .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: oklch(0.6 0.12 60 / 0.5); color: var(--fg); font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; }
    .list { background: var(--sidebar); border-right: 1.25px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .band { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 10px; border-bottom: 1.25px solid var(--border); }
    .band .t { font-size: 15px; font-weight: 600; }
    .search { margin: 10px 12px 4px; height: 30px; border: 1px solid var(--input); border-radius: 6px; background: var(--card); color: var(--muted-fg); padding: 0 10px; line-height: 28px; font-size: 12.5px; }
    .grp { border-bottom: 1px solid var(--border); }
    .grp-h { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 8px; align-items: center; padding: 9px 12px; color: var(--muted-fg); }
    .grp-h .k { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg); }
    .grp-h .n { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; }
    .grp-h .plus { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; color: var(--muted-fg); }
    .grp-h svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .rows { padding: 0 6px 8px; display: flex; flex-direction: column; gap: 1px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 6px; color: var(--fg); position: relative; }
    .row .sub { font-size: 11.5px; color: var(--muted-fg); }
    .row.on { background: var(--tint); }
    .row.on::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--primary); border-radius: 1px; }
    .subs { padding: 2px 0 6px 22px; display: flex; flex-direction: column; gap: 1px; }
    .subs .s { padding: 4px 10px; border-radius: 5px; font-size: 12.5px; color: var(--muted-fg); position: relative; }
    .subs .s.spy { color: var(--fg); background: var(--tint); }
    .subs .s.spy::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; background: var(--primary); }
    .content { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .chead { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 24px 12px; border-bottom: 1.25px solid var(--border); }
    .chead .t { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    .cbody { padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; max-width: 760px; }
    .sec { display: flex; flex-direction: column; gap: 8px; }
    .sec-h { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .sec-h .k { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); }
    .sec.spy .sec-h .k { color: var(--fg); }
    .field { display: grid; grid-template-columns: 1fr 240px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .field .l { font-weight: 500; }
    .field .g { font-size: 11.5px; color: var(--muted-fg); }
    .ctl { height: 30px; border: 1px solid var(--input); border-radius: 6px; background: var(--card); padding: 0 10px; line-height: 28px; font-size: 12.5px; color: var(--fg); display: flex; justify-content: space-between; }
    .ctl .v { color: var(--muted-fg); }
    .seg { display: inline-flex; border: 1px solid var(--input); border-radius: 6px; overflow: hidden; height: 30px; }
    .seg span { padding: 0 12px; line-height: 28px; font-size: 12.5px; color: var(--muted-fg); }
    .seg span.on { background: var(--tint); color: var(--fg); }
    .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; justify-self: end; }
    .switch i { width: 28px; height: 16px; border-radius: 8px; background: var(--muted); position: relative; display: inline-block; }
    .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted-fg); }
    .switch.on i { background: var(--primary); } .switch.on i::after { left: 14px; background: var(--primary-fg); }
    .btn { height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); font-family: inherit; font-size: 12.5px; font-weight: 500; line-height: 26px; white-space: nowrap; cursor: pointer; }
    .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn.danger { color: oklch(0.7 0.17 25); }
    .ctx { background: var(--sidebar); border-left: 2px solid var(--primary); display: flex; flex-direction: column; overflow: hidden; }
    .cband { padding: 12px 12px 10px; background: var(--raised); border-bottom: 1.25px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .cband .t { font-size: 15px; font-weight: 600; }
    .cband .gloss { font-size: 12px; color: var(--muted-fg); }
    .cview { padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; flex: 0 1 auto; overflow: hidden; }
    .ground { flex: 1 1 auto; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .kv .v { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted-fg); }
    .kick { display: flex; justify-content: space-between; padding: 6px 12px 4px; border-top: 1.25px solid var(--border); border-bottom: 1px solid var(--border); font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); background: var(--raised); }
    .kick .sel { color: var(--fg); }
    .cells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(max-content, 1fr); gap: 4px; padding: 6px 8px 8px; background: var(--raised); }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; border-radius: 6px; color: var(--muted-fg); font-size: 10.5px; font-weight: 500; position: relative; }
    .cell svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .cell.on { color: var(--fg); background: var(--tint); }
    .cell.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -8px; height: 2px; background: var(--primary); }
    .hint { padding: 8px 10px; border: 1px dashed var(--border); border-radius: 6px; font-size: 12px; color: var(--muted-fg); }
    .hint b { color: var(--fg); font-weight: 500; }
    .prow { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .prow .nm { font-weight: 500; } .prow .m { font-size: 11.5px; color: var(--muted-fg); }
    .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--muted); font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; color: var(--muted-fg); }
    .pill.on { background: var(--tint); color: var(--fg); }
    /* the popover (rail switcher) */
    .pop { position: absolute; left: 60px; bottom: 8px; width: 300px; background: var(--card); border: 1.25px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px oklch(0 0 0 / 0.35); padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
    .pop .who { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; padding: 4px 4px 8px; border-bottom: 1px solid var(--border); }
    .pop .who .av { width: 36px; height: 36px; }
    .pop .who .nm { font-weight: 600; } .pop .who .m { font-size: 11.5px; color: var(--muted-fg); }
    .pop .lbl { font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); padding: 2px 4px; }
    .pop .opt { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 6px 6px; border-radius: 6px; }
    .pop .opt.on { background: var(--tint); }
    .pop .opt .av { width: 24px; height: 24px; font-size: 9px; }
    .pop .opt svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .pop .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); }
    .pop .acct { display: flex; flex-direction: column; gap: 1px; font-size: 12px; }
    .pop .acct .m { font-size: 11px; color: var(--muted-fg); }
    /* phone */
    .ph { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
    .ph .top { padding: 14px 16px 10px; border-bottom: 1.25px solid var(--border); font-size: 17px; font-weight: 600; }
    .ph .grp-h { padding: 12px 16px; }
    .ph .row { padding: 11px 12px; font-size: 14px; }
    .ph .rows { padding: 0 8px 10px; }
    .tabbar { margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1.25px solid var(--border); background: var(--sidebar); }
    .tabbar .tb { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 10px; font-size: 10.5px; color: var(--muted-fg); }
    .tabbar .tb.on { color: var(--fg); }
    .tabbar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1.25px solid var(--border); border-radius: 14px 14px 0 0; padding: 10px 12px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -12px 32px oklch(0 0 0 / 0.35); }
    .sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--muted); margin: 0 auto 4px; }
</style>
</helmet>

<div class="root {{theme}}" style="width: 420px; height: 560px; position: relative;">
  <div class="shell" style="grid-template-columns: 56px 1fr;">
    <div class="rail"><div class="g" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></div><div class="g on" title="Chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"></path></svg></div><div class="g" title="Characters"><svg viewBox="0 0 24 24"><path d="M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a2.5 2.5 0 1 0 0-5M16 15.5a5 5 0 0 1 5.5 4.5"></path></svg></div><div class="g" title="Corpus"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"></path></svg></div><div class="g" title="Databank"><svg viewBox="0 0 24 24"><path d="M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"></path></svg></div><div class="g" title="Presets"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"></path></svg></div><div class="g" title="Refinery"><svg viewBox="0 0 24 24"><path d="M6 3h12l-4 8v7l-4 2v-9z"></path></svg></div><div class="g" title="Analytics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></div><div class="end g" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"></path></svg></div><div class="av" style="outline: 2px solid var(--primary); outline-offset: 2px;">T</div></div>
    <div style="background: var(--bg);"></div>
  </div>
  <div class="pop">
    <div class="who"><div class="av">T</div><div><div class="nm">Traveler</div><div class="m">Playing as · pinned as <span class="mono">{{user}}</span></div></div></div>
    <div class="lbl">Switch persona</div>
    <div class="opt on"><div class="av">T</div><span>Traveler</span><span class="pill on">playing</span></div>
    <div class="opt"><div class="av" style="background: oklch(0.55 0.1 200 / 0.5);">M</div><span>Mara</span><span></span></div>
    <div class="opt"><div class="av" style="background: oklch(0.55 0.09 300 / 0.5);">GM</div><span>The Narrator</span><span></span></div><div class="lbl" style="padding-top: 6px;">In Example — Midnight Run</div><div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px;"><span style="font-size: 12px; color: var(--muted-fg);">Applies</span><span class="seg" style="height: 24px;"><span class="on" style="line-height: 22px; font-size: 11.5px;">Everywhere</span><span style="line-height: 22px; font-size: 11.5px;">This chat</span></span></div><div class="opt"><span><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg></span><span>Re-attribute your 12 messages here</span><span class="pill">→ Mara</span></div>
    <div class="opt" style="color: var(--muted-fg);"><span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10M16 10v4"></path></svg></span><span>Manage personas in Settings</span><span>›</span></div>
    <div class="foot"><div class="acct"><span>nate</span><span class="m">signed in with Authentik · owner</span></div><button class="btn ghost danger" type="button">Log out</button></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"}}'>
class Component extends DCLogic { renderVals() { return { theme: (this.props.dark ?? true) ? "t-dark" : "t-light" }; } }
</script>
</body>
</html>
