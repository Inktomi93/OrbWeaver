<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the shell paints into the safe-area insets, which makes keeping content out
         of the notch / Island / home indicator OURS — every edge is paid at `.shell-grid` (shell.css).
         interactive-widget=resizes-content (§4b axis 4): the virtual keyboard shrinks the LAYOUT viewport
         so the composer reflows ABOVE it — dvh/svh alone are never shrunk by the keyboard (L6/J12).

         That second clause is Chrome/Firefox only (#1868, truth-repaired 2026-09-07). WebKit has never
         implemented `interactive-widget` (https://bugs.webkit.org/show_bug.cgi?id=259770, open), and
         Safari ships no Virtual Keyboard API either, so `env(keyboard-inset-*)` is unavailable as a
         fallback. On iOS the keyboard therefore covers the composer and the tab bar while the layout
         viewport — and `100dvh` with it — reports the full height as if nothing happened. The attribute
         stays: it is correct and load-bearing on Android. What answers the iOS half is per-surface, and
         today that is Base UI's `Drawer.VirtualKeyboardProvider` on the phone's modal sheets
         (features/app-shell/components/modal-host.tsx); the shell's own composer still rides platform
         behaviour, which is survivable only because the fields now clear the 16px focus-zoom floor.

         NO `user-scalable=no` AND NO `maximum-scale` — ever. They would "fix" the pinch-zoom symptom by
         taking zoom away from every low-vision reader. iOS has ignored `user-scalable=no` since iOS 10
         for exactly that reason. The zoom was a 15px-field defect, and it was fixed at the field. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- iOS Safari AUTO-LINKS anything that parses as a phone number into a tappable dial link, and this
         origin renders ARBITRARY MODEL-GENERATED PROSE — a roleplay transcript full of numbers is exactly
         the corpus that trips it, and the result is blue dial links the author never wrote inside someone
         else's dialogue. Off. This is a detection opt-out, not a linkification policy: real links in
         markdown are rendered by the seal and unaffected. -->
    <meta name="format-detection" content="telephone=no" />
    <title>orbweaver</title>
    <!-- The document's own one-line description (#194 — Lighthouse SEO scored 0/1 on its absence). It is
         NOT a marketing line: this origin is a self-hosted single-tenant app behind auth (see
         public/robots.txt, which disallows the whole origin), so the only readers are the browser's own
         chrome — a bookmark, a share sheet, an OS app-switcher card — and an agent reading the shell
         before `data-app-ready`. It says what the product IS, in the same voice public/llms.txt opens in,
         and is deliberately static: a per-route description needs SSR, which UI-Arch §6.1's SPA index
         does not have. -->
    <meta
      name="description"
      content="A local-first workspace for character-driven AI conversations, world knowledge, presets, analysis, and role-playing state."
    />
    <!-- The orb-web mark, direction A (docs/history/design/login-loading-screen.md §8/§9.6). The SVG is the
         primary icon (crisp at every dpi); the PNG pair covers non-SVG-favicon chrome. Declaring an
         icon also stops the browser's implicit /favicon.ico probe — the 404-on-first-load it fired
         when no icon link existed. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- PWA/home-screen identity (icons 192/512 + maskable live in the manifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser-chrome tint = the Hearth background per OS scheme (values from the generated theme
         tokens — oklch(0.158 0.006 60) / oklch(0.98 0.004 75) as sRGB hex; meta can't read CSS vars). -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0c0a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The single module entry — Vite's SPA index (UI-Arch §6.1: no file-based route codegen). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
