<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the shell paints into the iOS safe-area insets (§4.1 immersive layout).
         interactive-widget=resizes-content (§4b axis 4): the virtual keyboard shrinks the content so the
         composer reflows ABOVE it — dvh/svh alone are not shrunk by the keyboard (L6/J12). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>orbweaver</title>
    <!-- The orb-web mark (public/favicon.svg). Declaring an icon also stops the browser's implicit
         /favicon.ico probe — the 404-on-first-load it fired when no icon link existed. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The single module entry — Vite's SPA index (UI-Arch §6.1: no file-based route codegen). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
